    renderTeams();

    /* ------------------------------------------------------------ game flow */

    $("start").addEventListener("click", () => {
      const seedValue = $("seed").value.trim();
      try {
        game = E.createGame({
          away: JSON.parse(JSON.stringify(teams[0])),
          home: JSON.parse(JSON.stringify(teams[1])),
          park: $("park").value,
          innings: Math.max(1, Math.floor(Number($("innings").value) || 9)),
          weather: {
            mode: $("wx-mode").value,
            variation: $("wx-var").value,
            speed: Number($("wx-speed").value) || 0,
            from: readFrom(),
            altitude: $("wx-alt").value.trim() === "" ? null : Number($("wx-alt").value),
            roof: $("wx-roof").value
          },
          seed: seedValue === "" ? Math.floor(Math.random() * 1e9) : Number(seedValue),
          coach: [$("coach-0").value, $("coach-1").value]
        });
      } catch (error) {
        $("errors").textContent = error.message.replace(/\. /g, ".\n");
        return;
      }
      $("errors").textContent = "";
      game.teams.forEach((t, i) => { t.abbr = teamAbbr(teams[i]); t.color = teams[i].color || DEFAULT_COLORS[i]; });
      controls = [$("ctl-0").value, $("ctl-1").value];
      pitchControls = [$("pctl-0").value, $("pctl-1").value];
      fieldControls = [$("fctl-0").value, $("fctl-1").value];
      [0, 1].forEach((t) => { if (fieldControls[t] !== "sim") E.setShift(game, t, { preset: "none" }); });
      replays = new Map();
      sentBalls.clear();
      shiftKey = "";
      coachKey = "";
      resetUmpUI();
      aim = null;
      showOverlay(false);
      showAimUI(false);
      logKey = "";
      logSel = null;
      phase = "ready";
      lastBall = null;
      lastZone = null;
      $("log").innerHTML = "";
      $("setup").classList.add("hidden");
      $("play").classList.remove("hidden");
      loadPark(game.park.id);
      refresh();
    });

    $("btn-new").addEventListener("click", () => {
      stopAnim();
      clipSeq += 1;
      clearTimeout(revealTimer);
      clearTimeout(hrTimer);
      flight = null;
      holdView = false;
      $("btn-skip").classList.add("hidden");
      liveRun = null;
      game = null;
      $("setup").classList.remove("hidden");
    });

    const human = () => game && !game.over && controls[game.half] !== "sim";
    const mode = () => controls[game.half];

    function finishStep(event, rec) {
      phase = "ready";
      timing = null;
      const saved = event && event.ball && rec ? record(event, rec) : null;
      if (saved) lastBall = saved;
      revealAfter(saved, !!(event && event.foul));
    }

    // Hold the scoreboard and log until the play on the field has finished, so results aren't spoiled.
    let holdView = false;
    let pendingBanner = "";
    let revealTimer = null;
    function revealAfter(saved, keepScene) {
      clearTimeout(revealTimer);
      if (!saved) {
        holdView = false;
        refresh();
        if (!keepScene) sendScene();
        return;
      }
      holdView = true;
      refresh();
      const ms = playBall(saved.ball, saved.play, saved.snap, saved.pitch);
      hrPopup(saved);
      revealTimer = setTimeout(() => { holdView = false; if (pendingBanner) $("banner").textContent = pendingBanner; pendingBanner = ""; refresh(); }, ms);
    }

    let hrTimer = null;
    function hrPopup(saved) {
      if (!saved.ball.hr) return;
      const at = (preRoll(saved.pitch) + (saved.ball.pts.length ? saved.ball.pts[saved.ball.pts.length - 1].t : 3)) * 1000;
      clearTimeout(hrTimer);
      hrTimer = setTimeout(() => {
        const el = $("pitch-result");
        el.textContent = saved.ball.pole ? "OFF THE POLE — HOME RUN!" : "HOME RUN!";
        el.dataset.kind = "f";
        showOverlay(true);
        clearTimeout(resultTimer);
        resultTimer = setTimeout(() => { el.textContent = ""; if (phase === "ready") showOverlay(false); }, 2200);
      }, at);
    }

    // Plays back every plate appearance of a multi-at-bat sim in order: balls in play on the field,
    // strikeouts and walks as the final pitch plus a call banner.
    let clipSeq = 0;
    function playClips(clips) {
      clearTimeout(revealTimer);
      if (!clips.length) return revealAfter(null);
      const seq = ++clipSeq;
      holdView = true;
      $("btn-skip").classList.remove("hidden");
      refresh();
      let i = 0;
      const next = () => {
        if (seq !== clipSeq) return;
        if (i >= clips.length) return endClips();
        const clip = clips[i];
        i += 1;
        clearTimeout(resultTimer);
        $("pitch-result").textContent = "";
        if (clip.saved) {
          showOverlay(false);
          const ms = playBall(clip.saved.ball, clip.saved.play, clip.saved.snap, clip.saved.pitch);
          hrPopup(clip.saved);
          revealTimer = setTimeout(next, ms);
          return;
        }
        const event = clip.event;
        showOverlay(false);
        $("banner").innerHTML = "&nbsp;";
        if (clip.foul) {
          playFoul(event.foul, clip.rec);
          revealTimer = setTimeout(next, (preRoll(event.pitch) + event.foul.pts[event.foul.pts.length - 1].t + 0.8) * 1000);
          return;
        }
        sendScene(clip.rec.snap);
        const dur = preRoll(event.pitch);
        const steps = 24;
        const kind = event.pa && event.pa.result.kind;
        post({
          type: "gm-pitch",
          path: Array.from({ length: steps + 1 }, (_, k) => pitchPos(event.pitch, k / steps)),
          duration: dur,
          hold: 1.3,
          label: callText(event),
          color: kind === "bb" || (!kind && event.call === "ball") ? "#29845e" : "#b3392f"
        });
        revealTimer = setTimeout(next, (dur + 1.3) * 1000 + 100);
      };
      next();
    }

    function endClips() {
      clipSeq += 1;
      clearTimeout(revealTimer);
      clearTimeout(hrTimer);
      clearTimeout(resultTimer);
      flight = null;
      $("pitch-result").textContent = "";
      showOverlay(false);
      $("btn-skip").classList.add("hidden");
      holdView = false;
      if (pendingBanner) $("banner").textContent = pendingBanner;
      pendingBanner = "";
      refresh();
      sendScene();
    }
    $("btn-skip").addEventListener("click", endClips);

    const stealSel = new Set();

    const liveCtl = () => {
      const batHuman = controls[game.half] !== "sim";
      const fieldHuman = fieldControls[1 - game.half] !== "sim";
      const opts = batHuman || fieldHuman ? { live: { batHuman, fieldHuman } } : {};
      if (batHuman) opts.steal = [...stealSel];
      stealSel.clear();
      return opts;
    };

    function renderSteal() {
      const row = $("steal-row");
      const show = human() && phase === "ready" && game.bases.some(Boolean);
      row.classList.toggle("hidden", !show);
      if (!show) {
        // Keep the selection while the pitch is in progress; liveCtl consumes it when the pitch resolves.
        if (phase === "ready" || !game.bases.some(Boolean)) stealSel.clear();
        return;
      }
      const names = ["", "2B", "3B", "Home"];
      const odds = (base) => Math.round(E.stealOdds(game, base) * 100);
      row.innerHTML = `<span class="muted">Steal on next pitch:</span>` + [1, 2, 3].filter((b) => game.bases[b - 1]).map((b) =>
        `<label><input type="checkbox" data-steal="${b}" ${stealSel.has(b) ? "checked" : ""} ${E.canSteal(game, b, [b + 1]) ? "" : "disabled"}> ${esc(game.bases[b - 1].p.name)} → ${names[b]} <span class="muted">(~${odds(b)}%)</span></label>`).join("");
    }
    $("steal-row").addEventListener("change", (e) => {
      const b = Number(e.target.dataset.steal);
      if (e.target.checked) stealSel.add(b); else stealSel.delete(b);
    });

    // Everything needed to redraw a play later, captured before the pitch.
    function takeSnap() {
      const fielding = game.teams[1 - game.half];
      const batter = E.snapshot(game).batter;
      const positions = fielding.lineup.filter((player) => player.pos !== "DH").map((player) => player.pos).concat("P");
      const names = {};
      fielding.lineup.forEach((player) => { if (player.pos !== "DH") names[player.pos] = player.name; });
      names.P = fielding.pitchers[fielding.pIdx].name;
      const spots = {};
      const speeds = {};
      positions.forEach((pos) => { spots[pos] = E.shiftedSpot(game, pos, 1 - game.half, batter); });
      fielding.lineup.forEach((player) => { if (player.pos !== "DH") speeds[player.pos] = E.fieldSpeed(player); });
      speeds.P = E.fieldSpeed(fielding.pitchers[fielding.pIdx]);
      return {
        half: game.half,
        park: game.park.id,
        bases: game.bases.map((runner) => !!runner),
        baseNames: game.bases.map((runner) => (runner ? runner.p.name : null)),
        fielders: positions,
        spots,
        speeds,
        names,
        batter: batter.name
      };
    }

    function beginRec(pitch) {
      return { snap: takeSnap(), logBefore: game.log.length, pitch: { mph: pitch.mph, type: pitch.type } };
    }

    function record(event, rec, frames, extra) {
      const saved = { ball: event.ball, play: event.play, snap: rec.snap, pitch: rec.pitch, frames, extra };
      const index = game.log.findIndex((entry, i) => i >= rec.logBefore && entry.kind === "pa");
      if (index >= 0) replays.set(index, saved);
      return saved;
    }

    /* ------------------------------------------------------------ defensive shifts */

    let shiftKey = "";
    let shiftCustomOpen = false;
    const SHIFT_POS = ["1B", "2B", "SS", "3B", "LF", "CF", "RF"];

    function renderShift() {
      const team = 1 - game.half;
      const key = `${team}|${game.over}|${shiftCustomOpen}`;
      if (key === shiftKey) return;
      shiftKey = key;
      const row = $("shift-row");
      const panel = $("shift-custom");
      if (game.over) { row.innerHTML = ""; panel.classList.add("hidden"); return; }
      const cur = game.shifts[team] || { preset: "none", custom: {}, mirror: false };
      row.innerHTML = `<span class="muted">${esc(game.teams[team].name)} defense:</span><select id="shift-sel">` +
        Object.entries(E.SHIFT_PRESETS).map(([id, p]) => `<option value="${id}" ${cur.preset === id ? "selected" : ""}>${esc(p.name)}</option>`).join("") +
        `</select><i class="tip" tabindex="0" data-tip="Applies from the next pitch. Pull-side shifts follow the batter's handedness.">i</i>`;
      panel.classList.toggle("hidden", cur.preset !== "custom");
      if (cur.preset === "custom") {
        panel.innerHTML = `<span class="muted">Offsets in ft <i class="tip" tabindex="0" data-tip="x: positive toward the 1B side. y: positive deeper.">i</i></span>` +
          SHIFT_POS.map((pos) => {
            const c = cur.custom[pos] || { x: 0, y: 0 };
            return `<label>${pos} x <input data-sx="${pos}" type="number" step="any" value="${c.x}" style="width:58px"> y <input data-sy="${pos}" type="number" step="any" value="${c.y}" style="width:58px"></label>`;
          }).join("") +
          `<label><input type="checkbox" id="shift-mirror" ${cur.mirror ? "checked" : ""}> Mirror vs lefty batters</label>`;
      }
    }

    /* Manual coaching: bench moves for any team whose coach is set to Manual. */
    let coachKey = "";
    const manualCoach = () => game && game.coach.includes("manual");
    const ovrText = (p) => `OVR ${Math.round(E.batterOverall(p))} · CON ${p.rt.contact} PWR ${p.rt.power} SPD ${p.rt.speed} FLD ${p.rt.field}`;

    function renderCoach() {
      const panel = $("coach-panel");
      const show = manualCoach() && !game.over && phase === "ready" && !holdView && !liveRun;
      panel.classList.toggle("hidden", !show);
      if (!show) return;
      const bt = game.half, ft = 1 - game.half;
      const key = [game.inning, game.half, game.outs, game.bases.map((b) => (b ? b.p.name : "")).join(","),
        game.teams.map((t) => `${t.order % 9}${t.pIdx}${t.bench.length}${t.removed.length}${t.pitchers.map((p) => p.name).join("")}`).join("|"), game.pa ? game.pa.pitches : -1].join("/");
      if (key === coachKey) return;
      coachKey = key;
      const opt = (value, label) => `<option value="${value}">${esc(label)}</option>`;
      let html = `<div class="muted" style="margin-bottom:6px">Manual coaching <i class="tip" tabindex="0" data-tip="Substitutions are permanent. Plate-appearance, half-inning and game buttons pause after every batter so you can make changes.">i</i></div>`;
      if (game.coach[bt] === "manual") {
        const team = game.teams[bt];
        const batter = E.currentBatter(game);
        const canPH = game.pa ? game.pa.pitches === 0 : true;
        html += `<div class="row" style="gap:6px"><b>${esc(team.name)} batting</b>`;
        if (!team.bench.length) html += `<span class="muted">Bench is empty.</span>`;
        else {
          const options = team.bench.map((p, i) => opt(i, `${p.name} (${[p.natural, ...(p.alt || [])].join("/")}) · ${ovrText(p)}${E.positionPenalty(p, batter.pos) ? ` · out of position (−${E.positionPenalty(p, batter.pos)} FLD)` : ""}`)).join("");
          html += `<span>Pinch hit for ${esc(batter.name)}:</span><select id="ph-sel">${options}</select><button data-act="ph" ${canPH ? "" : "disabled"}>Pinch hit</button>`;
          game.bases.forEach((runner, b) => {
            if (!runner) return;
            const ro = team.bench.map((p, i) => opt(i, `${p.name} (${p.natural}) · SPD ${p.rt.speed} · ${ovrText(p)}`)).join("");
            html += `<span style="flex-basis:100%"></span><span>Pinch run for ${esc(runner.p.name)} (${["1st", "2nd", "3rd"][b]}):</span><select data-pr-sel="${b}">${ro}</select><button data-act="pr" data-base="${b}">Pinch run</button>`;
          });
        }
        html += `</div>`;
      }
      if (game.coach[ft] === "manual") {
        const team = game.teams[ft];
        const cur = team.pitchers[team.pIdx];
        html += `<div class="row" style="gap:6px;margin-top:6px"><b>${esc(team.name)} fielding</b>`;
        const rel = team.pitchers.map((p, i) => ({ p, i })).filter((x) => x.i > team.pIdx);
        if (!rel.length) html += `<span class="muted">No relievers left.</span>`;
        else html += `<span>Pitching change (${esc(cur.name)}, ${cur.stat.pc} pitches):</span><select id="pc-sel">${rel.map((x) => opt(x.i, `${x.p.name} · OVR ${Math.round(E.pitcherOverall(x.p))} · VELO ${x.p.rt.velo} CTL ${x.p.rt.control} MOV ${x.p.rt.movement}`)).join("")}</select><button data-act="pc">Change pitcher</button>`;
        if (team.bench.length) {
          html += `<span style="flex-basis:100%"></span><span>Defensive sub:</span><select id="ds-slot">${team.lineup.map((p, i) => opt(i, `${p.name} (${p.pos})`)).join("")}</select><span>for</span><select id="ds-bench">${team.bench.map((p, i) => opt(i, `${p.name} (${[p.natural, ...(p.alt || [])].join("/")}) · FLD ${p.rt.field} ARM ${p.rt.arm}`)).join("")}</select><button data-act="ds" ${!game.pa || game.pa.pitches === 0 ? "" : "disabled"}>Substitute</button>`;
        }
        html += `</div>`;
      }
      panel.innerHTML = html;
    }

    $("coach-panel").addEventListener("click", (e) => {
      const button = e.target.closest("[data-act]");
      if (!button || !game || busyCoach()) return;
      const act = button.dataset.act;
      let result;
      if (act === "ph") result = E.pinchHit(game, Number($("ph-sel").value));
      else if (act === "pr") result = E.pinchRun(game, Number(button.dataset.base), Number(document.querySelector(`[data-pr-sel="${button.dataset.base}"]`).value));
      else if (act === "pc") result = E.pitchingChange(game, Number($("pc-sel").value));
      else if (act === "ds") result = E.defensiveSub(game, Number($("ds-slot").value), Number($("ds-bench").value));
      if (result && !result.ok) $("banner").textContent = result.error;
      coachKey = "";
      refresh();
      sendScene();
    });
    const busyCoach = () => phase !== "ready" || holdView || liveRun;

    function readShift() {
      const team = 1 - game.half;
      const spec = { preset: $("shift-sel").value, custom: {}, mirror: !!($("shift-mirror") && $("shift-mirror").checked) };
      document.querySelectorAll("#shift-custom [data-sx]").forEach((input) => {
        const pos = input.dataset.sx;
        const y = document.querySelector(`#shift-custom [data-sy="${pos}"]`);
        spec.custom[pos] = { x: Number(input.value) || 0, y: Number(y.value) || 0 };
      });
      E.setShift(game, team, spec);
      return spec;
    }

    $("shift-row").addEventListener("change", (e) => {
      if (e.target.id !== "shift-sel") return;
      const wasCustom = (game.shifts[1 - game.half] || {}).preset === "custom";
      const spec = readShift();
      if (wasCustom !== (spec.preset === "custom")) { shiftKey = ""; renderShift(); }
      if (phase === "ready") sendScene();
    });
    $("shift-custom").addEventListener("change", () => { readShift(); if (phase === "ready") sendScene(); });

    /* ------------------------------------------------------------ umpire challenges */

    const humanFlags = () => [0, 1].map((t) => controls[t] !== "sim" || pitchControls[t] !== "sim" || fieldControls[t] !== "sim");
    const callGroup = (id) => (id === "abs" ? "abs" : id === "ff" ? "ff" : "out");
    const GROUP_NAME = { abs: "Ball / strike (ABS)", out: "Safe / out", ff: "Fair / foul" };
    let chal = null; // { calls, abs, until, secs, timer, raf, done, resolved }

    function resetUmpUI() {
      if (chal) { clearTimeout(chal.timer); cancelAnimationFrame(chal.raf); }
      chal = null;
      $("umpbar").classList.remove("on");
      $("btn-challenge").classList.remove("lit");
      $("chal-menu").classList.remove("on");
    }

    function openChallenge(review, secs, done) {
      resetUmpUI();
      chal = { calls: review.calls, abs: review.kind === "abs", secs, until: performance.now() + secs * 1000, done };
      const btn = $("btn-challenge");
      btn.classList.add("lit");
      const tick = () => {
        if (!chal || chal.menu) return;
        const left = chal.until - performance.now();
        btn.style.setProperty("--lit", `${Math.max(0, left / (chal.secs * 1000))}`);
        if (left > 0) chal.raf = requestAnimationFrame(tick);
      };
      tick();
      chal.timer = setTimeout(() => closeChallenge(null), secs * 1000);
      refresh();
    }

    function closeChallenge(result) {
      if (!chal || chal.closing) return;
      const done = chal.done;
      chal.closing = true;
      clearTimeout(chal.timer);
      cancelAnimationFrame(chal.raf);
      $("chal-menu").classList.remove("on");
      $("btn-challenge").classList.remove("lit");
      if (result) {
        $("ump-text").textContent = result.note;
        $("ump-btn").classList.add("hidden");
        $("umpbar").classList.add("on");
      }
      setTimeout(() => {
        $("umpbar").classList.remove("on");
        chal = null;
        done();
      }, result ? 1500 : 0);
    }

    function renderChallengeMenu() {
      const menu = $("chal-menu");
      if (!chal || chal.closing) { menu.classList.remove("on"); return; }
      // opening the menu freezes the window so the choice can be made
      chal.menu = true;
      clearTimeout(chal.timer);
      cancelAnimationFrame(chal.raf);
      $("btn-challenge").style.setProperty("--lit", "1");
      const team = chal.calls[0].team;
      const left = game.challenges[team];
      const rows = ["abs", "out", "ff"].map((group) => {
        const calls = chal.calls.filter((c) => callGroup(c.id) === group);
        const remain = group === "abs" ? left.abs : left.field;
        const label = `${GROUP_NAME[group]} <span class="muted">(${remain} left)</span>`;
        if (!calls.length || remain <= 0) return `<button disabled>${label}</button>`;
        if (calls.length === 1) return `<button data-chal="${esc(calls[0].id)}">${label}</button>`;
        return `<div>${label}</div><div class="sub">${calls.map((c) => `<button data-chal="${esc(c.id)}">${esc(c.label)}</button>`).join("")}</div>`;
      });
      menu.innerHTML = `<strong>What do you want to challenge?</strong>${rows.join("")}<button data-cancel="1">Never mind</button>`;
      menu.classList.add("on");
    }

    function fireChallenge(id) {
      const result = E.challengeCall(game, id);
      if (!result) return;
      closeChallenge(result);
    }

    $("btn-challenge").addEventListener("click", () => { if (chal && !chal.closing) renderChallengeMenu(); });
    $("ump-btn").addEventListener("click", () => { if (chal && !chal.closing) renderChallengeMenu(); });
    $("chal-menu").addEventListener("click", (e) => {
      if (e.target.closest("[data-cancel]")) return closeChallenge(null);
      const button = e.target.closest("[data-chal]");
      if (button) fireChallenge(button.dataset.chal);
    });

    function renderChal() {
      const open = !!(chal && !chal.closing);
      $("btn-challenge").disabled = !open;
      const flags = humanFlags();
      $("chal-left").textContent = game ? [0, 1].filter((t) => flags[t]).map((t) =>
        `${game.teams[t].name}: ${game.challenges[t].abs} ABS · ${game.challenges[t].field} field`).join("  |  ") : "";
    }

    function runUntil(done, forceEvery) {
      feedback = null;
      showOverlay(false);
      let guard = 0;
      let lastEvent = null;
      let lastRec = null;
      let lastSaved = null;
      const clips = [];
      const every = forceEvery || $("watch-mode").value === "every";
      let first = true;
      while (!game.over && guard < 20000) {
        // With a manual coach, stop between batters so substitutions can be made.
        if (!first && !game.pa && manualCoach()) break;
        first = false;
        const rec = beginRec(E.nextPitch(game));
        const event = E.stepPitch(game, undefined, { human: humanFlags() });
        guard += 1;
        if (event && event.ball) {
          lastEvent = event;
          lastSaved = record(event, rec);
          if (event.pa) clips.push({ saved: lastSaved });
        } else if (event && event.foul) {
          if (every) clips.push({ rec, event, foul: true });
        } else if (event && event.pitch && event.call && (every || (event.pa && (event.pa.result.kind === "k" || event.pa.result.kind === "bb")))) {
          clips.push({ rec, event, pitch: true });
        }
        if (done(event)) break;
      }
      phase = "ready";
      timing = null;
      if (lastSaved) lastBall = lastSaved;
      playClips(clips);
    }

    /* ------------------------------------------------------------ pitching */

    const pitchMode = () => pitchControls[1 - game.half];
    const showOverlay = (on) => $("zone-overlay").classList.toggle("on", on);
    const showAimUI = (on) => $("aim-ui").classList.toggle("hidden", !on);

    function startAim(pm) {
      const pitcher = game.pa.pitcher;
      const mix = Object.keys(pitcher.mix || E.DEFAULT_MIX);
      aim = { mode: pm, type: mix[0], x: 0, z: 2.5, accuracy: 1, meter: null, spread: E.pitchSpread(pitcher) };
      phase = "aim";
      $("aim-types").innerHTML = "";
      mix.forEach((key) => {
        const button = document.createElement("button");
        button.textContent = `${E.PITCH_TYPES[key].name} ${Math.round(pitcher.velo + E.PITCH_TYPES[key].dv)}`;
        button.dataset.type = key;
        button.className = key === aim.type ? "sel" : "";
        button.addEventListener("click", () => {
          if (phase !== "aim" || aim.meter) return;
          aim.type = key;
          [...$("aim-types").children].forEach((child) => child.classList.toggle("sel", child === button));
        });
        $("aim-types").append(button);
      });
      $("meter").classList.toggle("hidden", pm !== "advanced");
      $("btn-throw").textContent = pm === "advanced" ? "Start meter" : "Throw";
      $("aim-help").textContent = pm === "advanced" ? "Click the zone to aim, then stop the meter in the green." : "Click the zone to aim.";
      showAimUI(true);
      showOverlay(true);
      requestAnimationFrame(aimLoop);
      refresh();
    }

    function aimLoop(now) {
      if (phase !== "aim" || !aim) return;
      if (aim.meter) {
        const t = (now - aim.meter.start) / 1150;
        const m = Math.abs(((t % 2) + 2) % 2 - 1);
        aim.meter.value = m;
        $("meter-mark").style.left = `calc(${m * 100}% - 2px)`;
        if (t > 4) return releaseMeter(true);
      }
      drawZone();
      requestAnimationFrame(aimLoop);
    }

    function releaseMeter(timedOut) {
      const value = aim.meter ? aim.meter.value : 0;
      aim.accuracy = timedOut ? 2.2 : 0.4 + 1.8 * Math.abs(value - 0.5) * 2;
      throwAim();
    }

    function throwAim() {
      const chosen = { type: aim.type, x: aim.x, z: aim.z, accuracy: aim.accuracy };
      aim = null;
      deliver(E.nextPitch(game, chosen));
    }

    $("btn-throw").addEventListener("click", () => {
      if (phase !== "aim" || !aim) return;
      if (aim.mode !== "advanced") return throwAim();
      if (!aim.meter) {
        aim.meter = { start: performance.now(), value: 0 };
        $("btn-throw").textContent = "Release";
      } else releaseMeter();
    });

    function deliver(pitch) {
      pendingRec = beginRec(pitch);
      lastZone = { x: pitch.x, z: pitch.z, type: pitch.type, live: true };
      showAimUI(false);
      showOverlay(true);
      if (human()) {
        phase = "await";
        if (mode() === "timing") startTimingPitch(pitch);
        refresh();
        return;
      }
      phase = "throwing";
      flight = { pitch, start: performance.now(), duration: 750 };
      refresh();
      requestAnimationFrame(flightLoop);
    }

    function flightLoop() {
      if (!flight) return;
      drawZone();
      if (performance.now() > flight.start + flight.duration + 200) {
        flight = null;
        resolveManual(undefined);
        return;
      }
      requestAnimationFrame(flightLoop);
    }

    $("btn-pitch").addEventListener("click", () => {
      if (!game || game.over || phase !== "ready" || holdView) return;
      clearTimeout(resultTimer);
      $("pitch-result").textContent = "";
      feedback = null;
      lastZone = null;
      clearTimeout(sceneTimer);
      const queued = E.nextPitch(game);
      // A fully simulated pitch plays out on the field like the sim buttons do.
      if (pitchMode() === "sim" && !human() && fieldControls[1 - game.half] === "sim") return runUntil(() => true, true);
      sendScene();
      if (pitchMode() === "sim") return deliver(queued);
      startAim(pitchMode());
    });
    $("btn-pa").addEventListener("click", () => game && !game.over && runUntil((event) => event && event.pa));
    $("btn-half").addEventListener("click", () => {
      if (!game || game.over) return;
      const half = game.half;
      const inning = game.inning;
      runUntil(() => game.over || game.half !== half || game.inning !== inning);
    });
    $("btn-game").addEventListener("click", () => game && !game.over && runUntil(() => game.over));

    let pendingRec = null;

    function resolveManual(manual, ctx) {
      const rec = pendingRec || beginRec(E.nextPitch(game));
      const opts = ctx || { ...liveCtl(), human: humanFlags(), hold: true };
      const event = E.stepPitch(game, manual, opts);
      if (event && event.held) {
        pendingRec = rec;
        const review = E.pendingReview(game, opts);
        const resume = () => {
          if (event.held === "steal") settle(E.resumeSteal(game, opts), rec);
          else resolveManual(manual, opts);
        };
        if (review) {
          phase = "challenge";
          return openChallenge(review, event.held === "abs" ? 1 : 8, resume);
        }
        return resume();
      }
      settle(event, rec);
    }

    const CALL_TEXT = { ball: "BALL", "called strike": "STRIKE", "swinging strike": "SWING & MISS", foul: "FOUL" };
    let resultTimer = null;

    // Strikeouts and walks get their own call instead of the pitch call.
    function callText(event) {
      const r = event && event.pa && event.pa.result;
      if (r && r.kind === "k") return /looking/.test(event.pa.text) ? "STRIKEOUT LOOKING" : "STRIKEOUT SWINGING";
      if (r && r.kind === "bb") return "WALK";
      return event && CALL_TEXT[event.call];
    }

    // Keep the pitch screen up briefly and show the call in big letters.
    function showPitchResult(event) {
      const text = callText(event);
      clearTimeout(resultTimer);
      const el = $("pitch-result");
      if (!text) { el.textContent = ""; return false; }
      el.textContent = text;
      const kind = event.pa && event.pa.result.kind;
      el.dataset.kind = kind === "bb" || (!kind && event.call === "ball") ? "b" : event.call === "foul" ? "f" : "s";
      resultTimer = setTimeout(() => { el.textContent = ""; if (phase === "ready") showOverlay(false); }, kind === "k" || kind === "bb" ? 2200 : 1600);
      return true;
    }

    function settle(event, rec) {
      const keep = !(event && event.live) && showPitchResult(event);
      if (!keep) { $("pitch-result").textContent = ""; showOverlay(false); }
      phase = "ready";
      if (lastZone) lastZone = { ...lastZone, live: false };
      pendingRec = null;
      if (event && event.live) return startLive(event, rec);
      if (event && event.foul) playFoul(event.foul, rec);
      finishStep(event, rec);
    }

    // Smart fielder movement for a simulated play: every fielder's position over time.
    function buildTracks(snap, points, landing, primary, throws, runners, seconds) {
      if (!snap || !snap.speeds) return undefined;
      const fielders = snap.fielders.map((pos) => ({ pos, ...(snap.spots && snap.spots[pos] || E.defaultSpot(pos, E.parkById(snap.park))), speed: snap.speeds[pos] || 24 }));
      return E.fieldTracks({
        park: E.parkById(snap.park), fielders, pts: points, landing, primary, throws, runners,
        duration: Math.min(16, Math.max(2, seconds))
      });
    }

    function playFoul(flight, rec) {
      sendScene(rec && rec.snap);
      const points = flight.pts.map((p) => ({ t: p.t, x: p.x, y: p.y, z: p.z }));
      const end = points.length ? points[points.length - 1].t : 3;
      post({
        type: "gm-play",
        points,
        color: "#9aa59d",
        label: "Foul",
        landing: flight.landing ? { x: flight.landing.x, y: flight.landing.y } : undefined,
        fielder: null,
        throws: [],
        runners: [],
        tracks: buildTracks(rec && rec.snap, points, flight.landing, null, [], [], end + 1.5),
        lead: preRoll(rec && rec.pitch)
      });
    }
    $("btn-take").addEventListener("click", () => phase === "await" && resolveManual({ swing: false }));
    $("btn-whiff").addEventListener("click", () => phase === "await" && resolveManual({ swing: true, timing: 400, loc: 10 }));
    $("btn-simswing").addEventListener("click", () => phase === "await" && resolveManual(undefined));
    $("btn-hit").addEventListener("click", () => {
      if (phase !== "await") return;
      const ev = Number($("in-ev").value);
      const la = Number($("in-la").value);
      const dir = Number($("in-dir").value) || 0;
      if (!Number.isFinite(ev) || !Number.isFinite(la) || ev <= 0) return;
      resolveManual({ swing: true, timing: 0, loc: 0, ball: { ev, la, dir } });
    });

    /* ------------------------------------------------------------ timing swing */

    const SLOWMO = { rookie: 3.2, pro: 2.2, allstar: 1.5, real: 1 };
    const REAL_FLIGHT_MS = 420; // release to plate for a 92 mph pitch
    const BREAK = { FB: { x: -0.12, z: 0.3 }, SL: { x: 0.65, z: -0.35 }, CH: { x: -0.4, z: -0.5 }, CB: { x: 0.25, z: -1.1 } };
    const EYE_Z = 2.6;
    const PERSPECTIVE = 6.1;
    let reticle = { x: 0, z: 2.5 };
    let feedback = null;

    const slowmo = () => SLOWMO[$("difficulty").value] || 2.2;

    function startTimingPitch(pitch) {
      const duration = REAL_FLIGHT_MS * 92 / Math.max(65, pitch.mph) * slowmo();
      const wind = 650 + Math.random() * 650;
      feedback = null;
      timing = { pitch, start: performance.now() + wind, duration, slow: slowmo(), swung: null };
      requestAnimationFrame(timingLoop);
    }

    // World-space ball position (ft, catcher's view) at fraction p of the way to the plate.
    function pitchPos(pitch, p) {
      const s = pitch.hand === "L" ? -1 : 1;
      const br = BREAK[pitch.type] || BREAK.FB;
      const bx = br.x * s;
      const ax = pitch.x - bx;
      const az = pitch.z - br.z;
      const rx = -s * 1.6;
      const rz = 5.9;
      const late = p * p * p;
      return { x: rx + (ax - rx) * p + bx * late, z: rz + (az - rz) * p + br.z * late };
    }

    const perspective = (p) => 1 / (1 + (1 - p) * PERSPECTIVE);

    function timingLoop() {
      if (!timing) return;
      const now = performance.now();
      drawZone();
      const cross = timing.start + timing.duration;
      if (timing.swung) {
        if (now > cross + 650) {
          const swing = timing.swung.swing;
          resolveManual(swing);
          return;
        }
      } else if (now > cross + 350) {
        resolveManual({ swing: false });
        return;
      }
      requestAnimationFrame(timingLoop);
    }

    function swingAt(time, point) {
      if (phase !== "await" || mode() !== "timing" || !timing || timing.swung) return;
      const cross = timing.start + timing.duration;
      const pitch = timing.pitch;
      const dx = (point.x - pitch.x) * 12;
      const dz = (point.z - pitch.z) * 12;
      const miss = Math.hypot(dx, dz) * 0.6;
      const ms = (time - cross) / timing.slow;
      const swing = time < timing.start
        ? { swing: true, timing: 400, loc: 10 }
        : { swing: true, timing: ms, loc: dz <= 0 ? miss : -miss };
      const early = ms < 0;
      const vertical = Math.abs(dz) < 0.5 ? "" : dz < 0 ? `${Math.abs(dz).toFixed(1)} in low` : `${dz.toFixed(1)} in high`;
      const horizontal = Math.abs(dx) < 0.5 ? "" : dx < 0 ? `${Math.abs(dx).toFixed(1)} in toward 3B side` : `${dx.toFixed(1)} in toward 1B side`;
      const grade = Math.abs(ms) < 8 && Math.hypot(dx, dz) < 1.5 ? "Perfect" : Math.abs(ms) < TIMING_REF ? "Good" : "Mistimed";
      const parts = [Math.abs(ms) < 3 ? "on time" : `${Math.round(Math.abs(ms))} ms ${early ? "early" : "late"}`, vertical, horizontal].filter(Boolean);
      timing.swung = { swing, time, point, text: `${grade} — ${parts.join(" · ")}`, grade };
      feedback = { point, ball: { x: pitch.x, z: pitch.z }, text: timing.swung.text, grade };
    }
    const TIMING_REF = E.TIMING_WINDOW * 0.5;

    const canvasPoint = (event) => {
      const rect = $("zone-canvas").getBoundingClientRect();
      return zoneToWorld((event.clientX - rect.left) * 340 / rect.width, (event.clientY - rect.top) * 400 / rect.height);
    };
    $("zone-canvas").addEventListener("pointermove", (event) => { reticle = canvasPoint(event); });
    $("zone-canvas").addEventListener("pointerdown", (event) => {
      reticle = canvasPoint(event);
      if (phase === "aim" && aim && !aim.meter) {
        aim.x = Math.max(-1.6, Math.min(1.6, reticle.x));
        aim.z = Math.max(0.6, Math.min(4.4, reticle.z));
        return;
      }
      swingAt(event.timeStamp, reticle);
    });
    window.addEventListener("keydown", (event) => {
      if (event.code !== "Space") return;
      if (phase === "aim" && aim && aim.meter && !event.repeat) { event.preventDefault(); return releaseMeter(); }
      if (!timing || phase !== "await") return;
      event.preventDefault();
      if (!event.repeat) swingAt(event.timeStamp, reticle);
    });

    /* ------------------------------------------------------------ rendering */

    const ZONE_VIEW = { cx: 170, scale: 105, top: 4.7 };
    const zoneToCanvas = (x, z) => ({ x: ZONE_VIEW.cx + x * ZONE_VIEW.scale, y: (ZONE_VIEW.top - z) * ZONE_VIEW.scale });
    const zoneToWorld = (px, py) => ({ x: (px - ZONE_VIEW.cx) / ZONE_VIEW.scale, z: ZONE_VIEW.top - py / ZONE_VIEW.scale });

    // The zone border is visible before the pitch, fades as it comes in, and stays hidden during an ABS challenge.
    function zoneAlpha() {
      if (chal && chal.abs) return 0;
      const fade = (p) => Math.max(0, 1 - p / 0.25);
      const now = performance.now();
      if (timing) return now < timing.start ? 1 : fade((now - timing.start) / timing.duration);
      if (flight) return fade((now - flight.start) / flight.duration);
      return 1;
    }

    function drawZone() {
      const canvas = $("zone-canvas");
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const z = E.ZONE;
      const a = zoneToCanvas(-z.halfWidth, z.top);
      const b = zoneToCanvas(z.halfWidth, z.bottom);
      ctx.globalAlpha = zoneAlpha();
      ctx.strokeStyle = "#1f2a24";
      ctx.lineWidth = 2;
      ctx.strokeRect(a.x, a.y, b.x - a.x, b.y - a.y);
      ctx.lineWidth = 1;
      ctx.strokeStyle = "#bdb7a4";
      for (let i = 1; i < 3; i += 1) {
        ctx.beginPath();
        ctx.moveTo(a.x + (b.x - a.x) * i / 3, a.y); ctx.lineTo(a.x + (b.x - a.x) * i / 3, b.y);
        ctx.moveTo(a.x, a.y + (b.y - a.y) * i / 3); ctx.lineTo(b.x, a.y + (b.y - a.y) * i / 3);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      if (mode_isTiming() && (timing || feedback)) {
        const ringPx = E.LOC_WINDOW / 0.6 / 12 * ZONE_VIEW.scale;
        const drawReticle = (point, color) => {
          const c = zoneToCanvas(point.x, point.z);
          ctx.strokeStyle = color;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(c.x, c.y, ringPx, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(c.x - 5, c.y); ctx.lineTo(c.x + 5, c.y);
          ctx.moveTo(c.x, c.y - 5); ctx.lineTo(c.x, c.y + 5);
          ctx.stroke();
        };
        const ballAt = (p, cap) => {
          const p1 = Math.min(1, p);
          const world = pitchPos(timing.pitch, p1);
          const f = perspective(p1);
          const c = zoneToCanvas(world.x * f, EYE_Z + (world.z - EYE_Z) * f);
          let { x, y } = c;
          let r = Math.max(2.2, 0.15 * ZONE_VIEW.scale * f);
          if (p > 1) {
            // Past the plate the ball keeps going on its line, growing as it nears the camera.
            const wb = pitchPos(timing.pitch, 0.94);
            const fb = perspective(0.94);
            const cb = zoneToCanvas(wb.x * fb, EYE_Z + (wb.z - EYE_Z) * fb);
            const k = (p - 1) / 0.06;
            x += (c.x - cb.x) * k;
            y += (c.y - cb.y) * k;
            r *= 1 + (p - 1) * 2.2;
          }
          return { x, y, r, f };
        };
        if (timing) {
          const now = performance.now();
          const p = Math.min(1.4, Math.max(0, (now - timing.start) / timing.duration));
          if (now < timing.start) {
            ctx.fillStyle = "#6a7a6f";
            ctx.font = "600 13px system-ui, sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("Pitcher is winding up…", 170, 30);
            const rel = ballAt(0);
            ctx.beginPath();
            ctx.arc(rel.x, rel.y, 2.5, 0, Math.PI * 2);
            ctx.fillStyle = "#9aa59d";
            ctx.fill();
          } else {
            for (let k = 5; k >= 1; k -= 1) {
              const q = Math.max(0, p - k * 0.025);
              const tail = ballAt(q);
              ctx.globalAlpha = 0.09 * (6 - k);
              ctx.fillStyle = "#1f2a24";
              ctx.beginPath();
              ctx.arc(tail.x, tail.y, tail.r, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.globalAlpha = 1;
            const ball = ballAt(p);
            ctx.fillStyle = "#fffefa";
            ctx.strokeStyle = "#1f2a24";
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
          }
          drawReticle(timing.swung ? timing.swung.point : reticle, timing.swung ? "#d27637" : "#29845e");
          if (timing.swung) {
            ctx.fillStyle = "#1f2a24";
            ctx.font = "700 13px system-ui, sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(timing.swung.text, 170, 30);
          }
        } else {
          const miss = zoneToCanvas(feedback.ball.x, feedback.ball.z);
          ctx.fillStyle = "#1f2a24";
          ctx.beginPath();
          ctx.arc(miss.x, miss.y, 0.15 * ZONE_VIEW.scale, 0, Math.PI * 2);
          ctx.fill();
          drawReticle(feedback.point, "#d27637");
          ctx.fillStyle = "#1f2a24";
          ctx.font = "700 13px system-ui, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(feedback.text, 170, 30);
        }
        return;
      }
      if (aim) {
        const c = zoneToCanvas(aim.x, aim.z);
        const spread = aim.spread * ZONE_VIEW.scale;
        ctx.strokeStyle = "#d27637";
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 4]);
        ctx.beginPath();
        ctx.arc(c.x, c.y, spread, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.moveTo(c.x - 9, c.y); ctx.lineTo(c.x + 9, c.y);
        ctx.moveTo(c.x, c.y - 9); ctx.lineTo(c.x, c.y + 9);
        ctx.stroke();
        ctx.fillStyle = "#6a7a6f";
        ctx.font = "600 12px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("Circle = your typical miss (control / fatigue)", 170, 18);
        return;
      }
      if (flight) {
        const p = Math.min(1, (performance.now() - flight.start) / flight.duration);
        const world = pitchPos(flight.pitch, p);
        const f = perspective(p);
        const c = zoneToCanvas(world.x * f, EYE_Z + (world.z - EYE_Z) * f);
        ctx.fillStyle = "#fffefa";
        ctx.strokeStyle = "#1f2a24";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(c.x, c.y, Math.max(2.2, 0.15 * ZONE_VIEW.scale * f), 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        return;
      }
      if (!lastZone || (chal && chal.abs)) return;
      const target = zoneToCanvas(lastZone.x, lastZone.z);
      if (!lastZone.live || mode() !== "timing") {
        ctx.fillStyle = "#d27637";
        ctx.beginPath();
        ctx.arc(target.x, target.y, 9, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    const mode_isTiming = () => game && !game.over && mode() === "timing" && controls[game.half] === "timing";

    function drawField() { sendScene(); }

    function replay(rec) {
      if (!rec || phase !== "ready") return;
      replayId += 1;
      if (rec.frames) replayLive(rec);
      else playBall(rec.ball, rec.play, rec.snap, rec.pitch, true);
    }

    $("btn-replay").addEventListener("click", () => replay(lastBall));

    const frame = $("field-frame");
    let frameReady = false;
    const post = (message) => { if (frameReady && frame.contentWindow) frame.contentWindow.postMessage(message, "*"); };
    const frameSrc = (park) => `index.html?embed=1&game=1&park=${encodeURIComponent(park)}`;
    window.addEventListener("message", (event) => {
      if (event.source !== frame.contentWindow || !event.data || event.data.type !== "gm-ready") return;
      frameReady = true;
      if (game) sendScene();
    });
    function loadPark(parkId) {
      frameReady = false;
      frame.src = frameSrc(parkId);
    }

    function sendScene(snap) {
      if (!game) return;
      const s = snap || takeSnap();
      const lastName = (full) => (full ? E.shortName(full) : undefined);
      const fielders = s.fielders.map((pos) => ({ pos, name: lastName(s.names && s.names[pos]), ...((s.spots && s.spots[pos]) || E.defaultSpot(pos, game.park)) }));
      const runners = s.bases.map((on, index) => (on ? { base: index + 1, name: lastName(s.baseNames && s.baseNames[index]) } : null)).filter(Boolean);
      post({ type: "gm-park", park: s.park });
      const half = s.half === undefined ? game.half : s.half;
      const colors = { field: game.teams[1 - half].color, bat: game.teams[half].color };
      post({ type: "gm-scene", fielders, runners, colors, batter: game.over && !snap ? null : { name: lastName(s.batter) } });
    }

    const RESULT_COLOR = { out: "#758079", single: "#29845e", double: "#3277a7", triple: "#8c63a9", "home run": "#d27637" };
    const RESULT_NAME = { out: "Out", single: "Single", double: "Double", triple: "Triple", "home run": "Home run" };

    function stopAnim() {}

    function playBall(ball, play, snap, pitch, isReplay) {
      clearTimeout(sceneTimer);
      snap = snap || takeSnap();
      const spot = play && play.spot ? play.spot : null;
      const distance = Math.round(ball.hr ? (ball.hrDistance || ball.landing.d) : spot ? Math.hypot(spot.x, spot.y) : ball.landing.d);
      let result = "out";
      if (ball.hr) result = "home run";
      else if (play && play.kind === "hit") result = ["out", "single", "double", "triple", "home run"][play.hitBases] || "single";
      const label = `${RESULT_NAME[result]}${play && (play.kind === "error") ? " (E" + play.error + ")" : ""} · ${distance} ft`;
      const defenders = snap.fielders;
      const runners = [];
      if (play && play.entries) {
        for (const entry of play.entries) {
          const to = entry.out ? Math.max(entry.start + 1, entry.base) : entry.base;
          if (to <= entry.start) continue;
          runners.push({ name: entry.r && entry.r.p ? E.shortName(entry.r.p.name) : "", from: entry.start, to: Math.min(to, 4), out: entry.out, delay: entry.start === 0 ? 0.15 : 0.35, perBase: entry.start === 0 ? 3.6 : 3.1 });
        }
      }
      sendScene(snap);
      const fielded = !!(play && play.fielder && spot && !ball.hr && defenders.includes(play.fielder.pos));
      let points = ball.pts.map((point) => ({ t: point.t, x: point.x, y: point.y, z: point.z }));
      if (fielded) {
        const cut = Math.max(0.5, play.time || 2);
        points = points.filter((point) => point.t < cut);
        points.push({ t: cut, x: spot.x, y: spot.y, z: play.air ? 3 : 0.3 });
      }
      const throwList = fielded ? (play.throws || []).map((th) => ({ from: th.from, to: th.to, release: th.release, arrive: th.arrive, receiver: th.receiver })) : [];
      const tFlightEnd = points.length ? points[points.length - 1].t : 3;
      const tRunEnd = runners.reduce((m, r) => Math.max(m, r.delay + r.perBase * (r.to - r.from)), 0);
      const tracks = buildTracks(snap, points, ball.landing ? { x: ball.landing.x, y: ball.landing.y } : undefined,
        fielded ? { pos: play.fielder.pos, x: spot.x, y: spot.y, t: Math.max(0.5, play.time || 2) } : null,
        throwList, runners.map((r) => ({ from: r.from, to: r.to, delay: r.delay, perBase: r.perBase })),
        Math.max(tFlightEnd, tRunEnd, ...throwList.map((th) => th.arrive)) + 2.4);
      post({
        type: "gm-play",
        points,
        color: RESULT_COLOR[result],
        label,
        landing: fielded ? { x: spot.x, y: spot.y } : ball.landing ? { x: ball.landing.x, y: ball.landing.y } : undefined,
        fielder: fielded ? { pos: play.fielder.pos, x: spot.x, y: spot.y, t: Math.max(0.5, play.time || 2) } : null,
        throws: throwList,
        runners,
        tracks,
        lead: preRoll(pitch)
      });
      const bannerText = `${Math.round(ball.ev)} mph · ${Math.round(ball.la)}° · ${label}`;
      if (isReplay) $("banner").textContent = bannerText;
      else { $("banner").innerHTML = "&nbsp;"; pendingBanner = bannerText; }
      if (isReplay) sceneTimer = setTimeout(() => { if (phase === "ready") sendScene(); }, 9000);
      const flightEnd = points.length ? points[points.length - 1].t : 3;
      const runEnd = runners.reduce((m, r) => Math.max(m, r.delay + r.perBase * (r.to - r.from)), 0);
      return (preRoll(pitch) + Math.max(flightEnd, runEnd) + 1) * 1000;
    }

    // Seconds from release to the plate for the pre-roll shown before contact.
    const preRoll = (pitch) => Math.max(0.35, Math.min(0.9, 0.7 * 92 / Math.max(60, (pitch && pitch.mph) || 92)));

    /* ------------------------------------------------------------ live plays */

    let liveRun = null;
    let sceneTimer = null;

    const resultLabel = (ball, play) => {
      const spot = play && play.spot ? play.spot : null;
      const distance = Math.round(spot ? Math.hypot(spot.x, spot.y) : ball.landing.d);
      let result = "out";
      if (play && play.kind === "hit") result = ["out", "single", "double", "triple", "home run"][play.hitBases] || "single";
      return {
        text: `${RESULT_NAME[result]}${play && play.kind === "error" ? " (E" + play.error + ")" : ""} · ${distance} ft`,
        color: RESULT_COLOR[result],
        landing: spot ? { x: spot.x, y: spot.y } : ball.landing ? { x: ball.landing.x, y: ball.landing.y } : undefined
      };
    };

    function startLive(event, rec) {
      clearTimeout(sceneTimer);
      phase = "live";
      liveAdd = 0;
      timing = null;
      liveRun = { event, rec, live: event.live, frames: [], acc: 0, steps: 0, last: performance.now(), extra: { color: "#d27637" }, pre: 0, preLen: preRoll(rec && rec.pitch) };
      refresh();
      requestAnimationFrame(liveTick);
    }

    function liveFrame(extra, run = liveRun) {
      const frame = run.live.snapshot();
      frame.paused = decisionPause() && !!frame.pending;
      return { ...frame, ...extra };
    }

    const decisionPause = () => $("decision").value === "pause";

    function liveTick(now) {
      if (!liveRun) return;
      const run = liveRun;
      const dt = Math.min(0.05, (now - run.last) / 1000);
      run.last = now;
      if (run.pre < 1) {
        run.pre = Math.min(1, run.pre + dt / run.preLen);
        post({ type: "gm-frame", frame: { ...liveFrame(run.extra), pre: run.pre } });
        return requestAnimationFrame(liveTick);
      }
      if (!(decisionPause() && run.live.pending())) {
        run.acc += dt;
        while (run.acc >= 1 / 120 && !run.live.done) {
          run.live.step(1 / 120);
          run.acc -= 1 / 120;
          run.steps += 1;
          if (run.steps % 2 === 0) run.frames.push(liveFrame(run.extra));
        }
      }
      if (run.live.done) return finishLive();
      const shown = liveFrame(run.extra);
      const scoredNow = shown.runners.filter((r) => r.scored).length;
      if (scoredNow !== liveAdd) { liveAdd = scoredNow; renderBug(E.snapshot(game)); }
      const sug = shown.relay.find((r) => r.suggest);
      $("relay-hint").textContent = sug ? `Relay suggested for ${["", "1B", "2B", "3B", "home"][sug.base]} via ${sug.pos}` : "";
      post({ type: "gm-frame", frame: shown });
      requestAnimationFrame(liveTick);
    }

    function finishLive() {
      const run = liveRun;
      liveRun = null;
      const opts = { human: humanFlags() };
      const review = E.reviewLive(game, opts);
      if (!review) return concludeLive(run, opts);
      phase = "challenge";
      loopChallenge(run.frames);
      openChallenge(review, 8, () => concludeLive(run, opts));
    }

    // Replay the play on a loop while the challenge window is open.
    function loopChallenge(frames) {
      const id = ++replayId;
      let i = 0;
      let wait = 0;
      const tick = () => {
        if (id !== replayId || phase !== "challenge" || !frames.length) return;
        if (wait > 0) { wait -= 1; return requestAnimationFrame(tick); }
        post({ type: "gm-frame", frame: { ...frames[i], replay: true } });
        i += 1;
        if (i >= frames.length) { i = 0; wait = 60; }
        requestAnimationFrame(tick);
      };
      wait = 45;
      requestAnimationFrame(tick);
    }

    function concludeLive(run, opts) {
      const event = E.completeLive(game, opts);
      const info = resultLabel(event.ball, event.play);
      run.extra = { color: info.color, label: info.text, landing: info.landing };
      const last = { ...liveFrame(run.extra, run), done: true };
      run.frames.push(last);
      post({ type: "gm-frame", frame: last });
      phase = "ready";
      liveAdd = 0;
      lastBall = record(event, run.rec || beginRec({ mph: 92, type: "FB" }), run.frames, run.extra);
      $("banner").textContent = `${Math.round(event.ball.ev)} mph · ${Math.round(event.ball.la)}° · ${info.text}`;
      refresh();
      sceneTimer = setTimeout(() => { if (!liveRun) sendScene(); }, 2200);
    }

    let replayId = 0;

    function replayLive(rec) {
      clearTimeout(sceneTimer);
      const id = ++replayId;
      sendScene(rec.snap);
      const base = rec.frames[0];
      const preCount = Math.round(preRoll(rec.pitch) * 60);
      const frames = Array.from({ length: preCount }, (_, i) => ({ ...base, pre: (i + 1) / preCount, paused: false })).concat(rec.frames);
      let i = 0;
      const tick = () => {
        if (id !== replayId || liveRun || phase === "live") return;
        const frame = { ...frames[Math.min(i, frames.length - 1)], replay: true };
        post({ type: "gm-frame", frame });
        i += 1;
        if (i < frames.length) requestAnimationFrame(tick);
        else sceneTimer = setTimeout(() => { if (!liveRun) sendScene(); }, 1800);
      };
      requestAnimationFrame(tick);
    }

    window.addEventListener("message", (event) => {
      if (event.source !== frame.contentWindow || !event.data || event.data.type !== "gm-action" || !liveRun) return;
      const action = event.data.action;
      if (action && action.kind === "throw" && typeof action.target === "number") action.relay = $("relay-on").checked;
      liveRun.live.command(action);
    });

    window.addEventListener("keydown", (event) => {
      if (!liveRun || event.repeat || event.ctrlKey || event.metaKey || event.altKey) return;
      if (/INPUT|SELECT|TEXTAREA/.test(document.activeElement && document.activeElement.tagName)) return;
      const key = event.key.toLowerCase();
      const live = liveRun.live;
      if (key === "r") $("relay-on").checked = !$("relay-on").checked;
      else if ("1234".includes(key) && key) live.command({ kind: "throw", target: Number(key), relay: $("relay-on").checked });
      else if (key === "h") live.command({ kind: "throw", target: "hold" });
      else if (key === "a") live.command({ kind: "throw", target: null });
      else if ("gsb".includes(key)) {
        const snap = live.snapshot();
        const pend = snap.pending && snap.pending.type === "runner" ? snap.pending.id : null;
        const runner = snap.runners.find((r) => r.id === pend) || snap.runners.find((r) => r.decide) || snap.runners.find((r) => r.canGo && r.state === "hold" && !r.out && !r.scored);
        if (runner) live.command({ kind: "runner", id: runner.id, action: key === "g" ? "go" : key === "s" ? "stop" : "back" });
      } else return;
      event.preventDefault();
    });

    function dots(id, count, max, cls) {
      $(id).innerHTML = Array.from({ length: max }, (_, i) => `<span class="dot ${i < count ? "on " + cls : ""}"></span>`).join("");
    }

    function esc(text) {
      return String(text).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    }

    let liveAdd = 0;

    function renderBug(snap) {
      const team = (i) => {
        const col = game.teams[i].color || DEFAULT_COLORS[i];
        const batting = !game.over && game.half === i;
        return `<div class="b-row${batting ? " bat" : ""}" style="background:${col}${batting ? "" : "99"};color:${inkOn(col)}"><span>${esc(game.teams[i].abbr)}</span><span class="b-score">${game.score[i] + (i === game.half ? liveAdd : 0)}</span></div>`;
      };
      const on = (b) => (!game.over && game.bases[b] ? "#f2c14e" : "rgba(255,255,255,.2)");
      const dia = `<svg width="34" height="24" viewBox="0 0 34 24"><g stroke="rgba(255,255,255,.55)" stroke-width="1">` +
        [[17, 5, 2], [26, 14, 1], [8, 14, 3]].map(([x, y, b]) => `<rect x="${x - 4}" y="${y - 4}" width="8" height="8" transform="rotate(45 ${x} ${y})" fill="${on(b - 1)}"/>`).join("") +
        `</g></svg>`;
      const dots = (n, max) => `<div class="b-dots">${Array.from({ length: max }, (_, i) => `<i class="${i < n ? "on" : ""}"></i>`).join("")}</div>`;
      const inn = game.over ? "FINAL" : `${game.half === 0 ? "▲" : "▼"} ${game.inning}`;
      const bs = game.over ? null : snap.batter.stat;
      const ps = game.over ? null : snap.pitcher.stat;
      const wxv = game.env ? E.windNow(game, true) : { x: 0, y: 0 };
      const wxSpeed = Math.round(Math.hypot(wxv.x, wxv.y));
      const wxArrow = wxSpeed < 1 ? "" : `<svg width="12" height="12" viewBox="-6 -6 12 12" style="vertical-align:-2px;margin-right:3px"><path d="M0 5 L0 -5 M-3 -2 L0 -5 L3 -2" stroke="#f2c14e" stroke-width="1.6" fill="none" transform="rotate(${Math.round(Math.atan2(wxv.x, wxv.y) * 180 / Math.PI)})"/></svg>`;
      const wxText = game.over || !game.env ? "" : `<div class="b-wx" style="font-size:10px;opacity:.85;margin-top:3px">${wxSpeed < 1 ? "Wind calm" : `${wxArrow}${wxSpeed} mph ${E.windText(wxv)}`}</div>`;
      $("bug").innerHTML = `<div class="b-teams">${team(0)}${team(1)}</div>` +
        `<div class="b-mid"><span class="b-inn">${inn}</span>${game.over ? "" : dia + `<div style="display:flex;gap:8px;align-items:center;font-size:11px">${snap.count.balls}-${snap.count.strikes}${dots(snap.outs, 3)}</div>`}</div>` +
        (game.over ? "" : `<div class="b-who"><span><b>AB</b>${esc(snap.batter.name)} <i style="opacity:.7;font-style:normal">${bs.h}-${bs.ab}</i></span><span><b>P</b>${esc(snap.pitcher.name)} <i style="opacity:.7;font-style:normal">${ps.pc}P</i></span>${wxText}</div>`);
    }

    function refresh() {
      const snap = E.snapshot(game);
      const isHuman = human();
      const awaiting = phase === "await";
      const busy = phase !== "ready" || holdView;
      if (!holdView) {
      renderBug(snap);
      dots("dots-b", snap.count.balls, 3, "b");
      dots("dots-s", snap.count.strikes, 2, "s");
      dots("dots-o", snap.outs, 3, "o");
      $("inning-label").textContent = game.over
        ? `Final: ${game.teams[0].name} ${snap.score[0]}, ${game.teams[1].name} ${snap.score[1]}`
        : `${snap.half === 0 ? "Top" : "Bottom"} ${snap.inning}`;
      $("matchup").textContent = game.over
        ? ""
        : `${snap.batter.name} (${snap.battingTeam}) vs ${snap.pitcher.name}  ·  bases: ${snap.bases.map((name, i) => `${i + 1}B ${name || "–"}`).join(", ")}`;

      // scoreboard
      const innings = Math.max(game.innings, game.lineScore[0].length, game.lineScore[1].length);
      let head = "<tr><th></th>";
      for (let i = 1; i <= innings; i += 1) head += `<th>${i}</th>`;
      head += "<th>R</th><th>H</th><th>E</th></tr>";
      const rows = game.teams.map((team, index) => {
        let row = `<tr><td><strong>${esc(team.name)}</strong></td>`;
        for (let i = 0; i < innings; i += 1) {
          const value = game.lineScore[index][i];
          row += `<td>${value === undefined ? (index === 1 && game.over && i >= game.lineScore[1].length ? "x" : "") : value}</td>`;
        }
        return row + `<td><strong>${game.score[index]}</strong></td><td>${game.hits[index]}</td><td>${game.errors[index]}</td></tr>`;
      });
      $("score").innerHTML = `<table>${head}${rows.join("")}</table>`;

      // log
      renderLog();
      }
      $("btn-pitch").disabled = game.over || busy;
      const pm = game.over ? "sim" : pitchMode();
      $("btn-pitch").textContent = pm !== "sim" ? "Pitch" : isHuman ? (mode() === "timing" ? "Next pitch (then swing)" : "Next pitch") : "Next pitch";
      for (const id of ["btn-pa", "btn-half", "btn-game"]) $(id).disabled = game.over || busy;
      $("evla").classList.toggle("hidden", !(isHuman && mode() === "evla"));
      renderSteal();
      renderChal();
      renderShift();
      renderCoach();
      $("relay-row").classList.toggle("hidden", game.over || fieldControls[1 - game.half] === "sim");
      $("timing-help").classList.toggle("hidden", !(isHuman && mode() === "timing"));
      for (const id of ["btn-hit", "btn-take", "btn-whiff", "btn-simswing"]) $(id).disabled = !awaiting;

      const p = lastZone;
      $("pitch-info").textContent = p && !(awaiting && mode() === "timing")
        ? `${E.PITCH_TYPES[p.type].name}` + (game.log.length ? "" : "")
        : (awaiting ? "Pitch is on its way…" : "");
      if (awaiting && mode() === "evla" && p) {
        const pt = E.PITCH_TYPES[p.type];
        $("pitch-info").textContent = `${pt.name} — choose what the batter does`;
      }
      if (phase === "aim") $("pitch-info").textContent = aim && aim.mode === "advanced" ? "Pick a pitch and location, then time the meter" : "Pick a pitch and location, then throw";
      drawZone();
      if (!lastBall) drawField();
      renderBox();
      archiveGame();
    }

    function renderLog() {
      const sections = [];
      game.log.forEach((entry, index) => {
        if (entry.kind === "header" || !sections.length) sections.push({ title: entry.kind === "header" ? entry.text.replace(/ - .*$/, "") : "Start", items: [] });
        sections[sections.length - 1].items.push({ entry, index });
      });
      const select = $("log-inning");
      const current = sections.length - 1;
      const key = `${sections.map((s) => s.items.length).join(",")}|${logSel}|${sentBalls.size}`;
      if (key === logKey) return;
      logKey = key;
      select.innerHTML = "";
      sections.forEach((section, i) => {
        const label = i === current && !game.over ? `${section.title} (current)` : section.title;
        select.add(new Option(label, String(i)));
      });
      if (logSel !== null && logSel > current) logSel = null;
      select.value = String(logSel === null ? current : logSel);
      const log = $("log");
      log.innerHTML = "";
      for (const { entry, index } of (sections[Number(select.value)] || { items: [] }).items) {
        const div = document.createElement("div");
        div.className = `${entry.kind}${entry.scoring ? " scoring" : ""}`;
        div.textContent = entry.text;
        if (replays.has(index)) {
          const rec = replays.get(index);
          div.classList.add("replayable");
          div.textContent = `▶ ${entry.text}`;
          div.title = "Click to replay this play";
          div.addEventListener("click", () => { lastBall = rec; replay(rec); });
        }
        if (entry.ballIdx !== undefined) {
          const sent = sentBalls.has(entry.ballIdx);
          const send = document.createElement("button");
          send.className = "sendchart";
          send.textContent = sent ? "✓ On chart" : "→ Chart";
          send.disabled = sent;
          send.title = "Send this ball to the spray chart";
          send.addEventListener("click", (ev) => { ev.stopPropagation(); sendToChart([entry.ballIdx]); });
          div.append(send);
        }
        log.append(div);
      }
      log.scrollTop = logSel === null ? log.scrollHeight : 0;
    }

    $("log-inning").addEventListener("change", () => {
      const sections = game.log.filter((entry) => entry.kind === "header").length || 1;
      const value = Number($("log-inning").value);
      logSel = value >= sections - 1 ? null : value;
      logKey = "";
      renderLog();
    });

    function boxHtml(box) {
      return box.map((team) => {
        const bat = team.batters.map((b) => `<tr><td>${esc(b.name)} <span class="muted">${b.sub ? "↳ " : ""}${b.pos}</span></td><td>${b.ab}</td><td>${b.r}</td><td>${b.h}</td><td>${b.d}</td><td>${b.t}</td><td>${b.hr}</td><td>${b.rbi}</td><td>${b.bb}</td><td>${b.k}</td><td>${b.sb}</td><td>${b.cs}</td></tr>`).join("");
        const pit = team.pitchers.map((p) => `<tr><td>${esc(p.name)}</td><td>${Math.floor(p.outs / 3)}.${p.outs % 3}</td><td>${p.h}</td><td>${p.r}</td><td>${p.bb}</td><td>${p.k}</td><td>${p.hr}</td><td>${p.pc}</td></tr>`).join("");
        return `<h3>${esc(team.name)}</h3><table><tr><th>Batter</th><th>AB</th><th>R</th><th>H</th><th>2B</th><th>3B</th><th>HR</th><th>RBI</th><th>BB</th><th>K</th><th>SB</th><th>CS</th></tr>${bat}</table>`
          + `<table style="margin-top:6px"><tr><th>Pitcher</th><th>IP</th><th>H</th><th>R</th><th>BB</th><th>K</th><th>HR</th><th>PC</th></tr>${pit}</table>`;
      }).join("");
    }

    function renderBox() {
      $("box").innerHTML = boxHtml(E.boxScore(game));
    }

    /* ------------------------------------------------------------ game archive */

    const ARCHIVE_KEY = "field-notes-game-archive-v1";
    const loadArchive = () => {
      try { const a = JSON.parse(localStorage.getItem(ARCHIVE_KEY) || "[]"); return Array.isArray(a) ? a : []; } catch (error) { return []; }
    };
    const saveArchive = (list) => {
      try { localStorage.setItem(ARCHIVE_KEY, JSON.stringify(list)); return true; } catch (error) { return false; }
    };

    function archiveGame() {
      if (!game || !game.over || game.archived) return;
      game.archived = true;
      const entry = {
        id: Date.now() + "-" + Math.floor(Math.random() * 1e5),
        date: new Date().toISOString(),
        park: game.park.name,
        innings: game.innings,
        teams: game.teams.map((t) => ({ name: t.name, abbr: t.abbr || teamAbbr(t), color: t.color })),
        score: game.score.slice(),
        hits: game.hits.slice(),
        errors: game.errors.slice(),
        lineScore: game.lineScore.map((l) => l.slice()),
        winner: game.winner,
        box: E.boxScore(game),
        log: game.log.map((l) => ({ kind: l.kind, text: l.text, scoring: !!l.scoring })),
        balls: E.sprayChartEntries(game)
      };
      const list = loadArchive();
      list.unshift(entry);
      if (!saveArchive(list)) {
        list.shift();
        $("banner").textContent = "Couldn't archive this game: browser storage is full. Delete old archived games to make room.";
        game.archived = false;
        return;
      }
      renderArchive();
    }

    let archiveOpen = null;
    function renderArchive() {
      const host = $("archive");
      const list = loadArchive();
      $("archive-count").textContent = list.length ? `(${list.length})` : "";
      host.innerHTML = "";
      if (!list.length) {
        host.innerHTML = '<div class="muted">No archived games yet. Finished games are saved here automatically.</div>';
        return;
      }
      const table = document.createElement("table");
      table.className = "arch-table";
      table.innerHTML = "<tr><th>Date</th><th>Final</th><th>Park</th><th></th></tr>";
      list.forEach((g) => {
        const row = table.insertRow();
        const d = new Date(g.date);
        const [a, h] = g.teams;
        row.insertCell().textContent = d.toLocaleDateString() + " " + d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        row.insertCell().innerHTML = `<b>${esc(a.abbr)}</b> ${g.score[0]} – ${g.score[1]} <b>${esc(h.abbr)}</b>`;
        row.insertCell().textContent = g.park;
        const actions = row.insertCell();
        const view = document.createElement("button");
        view.textContent = archiveOpen === g.id ? "Hide" : "View";
        view.addEventListener("click", () => { archiveOpen = archiveOpen === g.id ? null : g.id; renderArchive(); });
        const del = document.createElement("button");
        del.textContent = "Delete";
        del.addEventListener("click", () => {
          if (!confirm("Delete this archived game?")) return;
          saveArchive(loadArchive().filter((x) => x.id !== g.id));
          if (archiveOpen === g.id) archiveOpen = null;
          renderArchive();
        });
        actions.append(view, " ", del);
      });
      host.append(table);
      const g = list.find((x) => x.id === archiveOpen);
      if (!g) return;
      const view = document.createElement("div");
      view.className = "arch-view";
      const innings = Math.max(g.innings, g.lineScore[0].length, g.lineScore[1].length);
      let head = "<tr><th></th>";
      for (let i = 1; i <= innings; i += 1) head += `<th>${i}</th>`;
      head += "<th>R</th><th>H</th><th>E</th></tr>";
      const rows = g.teams.map((t, ti) => {
        let r = `<tr><td><strong>${esc(t.name)}</strong></td>`;
        for (let i = 0; i < innings; i += 1) r += `<td>${g.lineScore[ti][i] === undefined ? "" : g.lineScore[ti][i]}</td>`;
        return r + `<td><strong>${g.score[ti]}</strong></td><td>${g.hits[ti]}</td><td>${g.errors[ti]}</td></tr>`;
      }).join("");
      const logHtml = g.log.map((l) => `<div class="${l.kind}${l.scoring ? " scoring" : ""}">${esc(l.text)}</div>`).join("");
      view.innerHTML = `<div class="score"><table>${head}${rows}</table></div><div class="box">${boxHtml(g.box)}</div><h3>Play log</h3><div class="log" style="height:260px">${logHtml}</div>`;
      const bar = document.createElement("div");
      bar.className = "row";
      bar.style.marginTop = "8px";
      const chart = document.createElement("button");
      chart.textContent = `Send ${g.balls.length} balls to spray chart`;
      chart.disabled = !g.balls.length;
      chart.addEventListener("click", () => {
        try {
          const existing = JSON.parse(localStorage.getItem(SPRAY_KEY) || "[]");
          localStorage.setItem(SPRAY_KEY, JSON.stringify([...(Array.isArray(existing) ? existing : []), ...g.balls]));
          chart.textContent = "✓ Sent";
          chart.disabled = true;
        } catch (error) { chart.textContent = "Couldn't save"; }
      });
      const dl = document.createElement("button");
      dl.textContent = "Download JSON";
      dl.addEventListener("click", () => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([JSON.stringify(g, null, 1)], { type: "application/json" }));
        a.download = `game-${g.teams[0].abbr}-${g.teams[1].abbr}-${g.date.slice(0, 10)}.json`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      });
      bar.append(chart, dl);
      view.append(bar);
      host.append(view);
    }
    renderArchive();

    const sentBalls = new Set();
    function sendToChart(indices) {
      const fresh = indices.filter((i) => !sentBalls.has(i));
      const entries = fresh.length ? E.sprayChartEntries(game, undefined, fresh) : [];
      if (!entries.length) return false;
      try {
        const existing = JSON.parse(localStorage.getItem(SPRAY_KEY) || "[]");
        localStorage.setItem(SPRAY_KEY, JSON.stringify([...(Array.isArray(existing) ? existing : []), ...entries]));
        fresh.forEach((i) => sentBalls.add(i));
        $("banner").textContent = `Sent ${entries.length} ball${entries.length > 1 ? "s" : ""} to the spray chart (${game.park.name}).`;
        renderLog();
        return true;
      } catch (error) {
        $("banner").textContent = "Couldn't save to the spray chart.";
        return false;
      }
    }

    $("btn-export").addEventListener("click", () => {
      if (!game) return;
      const all = game.battedBalls.map((_, i) => i).filter((i) => !sentBalls.has(i));
      if (!all.length) { $("banner").textContent = "No new balls in play to send."; return; }
      sendToChart(all);
    });

    window.__game = { get game() { return game; }, E };
  })();
  </script>
</body>
</html>
