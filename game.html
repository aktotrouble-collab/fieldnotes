<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Field Notes · Game Mode</title>
  <style>
    :root { --bg:#f4f1e8; --card:#fffdf7; --ink:#1f2a24; --mute:#6c756f; --line:#ddd7c6; --green:#29845e; --accent:#d27637; --blue:#3277a7; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui, "Segoe UI", sans-serif; }
    a { color:var(--green); }
    header { display:flex; align-items:center; justify-content:space-between; padding:14px 22px; border-bottom:1px solid var(--line); background:var(--card); }
    header h1 { margin:0; font-size:18px; }
    header span { color:var(--mute); font-size:13px; margin-left:8px; }
    main { max-width:1280px; margin:0 auto; padding:18px 22px 60px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:14px; }
    .card h2 { margin:0 0 10px; font-size:15px; }
    .row { display:flex; flex-wrap:wrap; gap:12px; align-items:end; }
    label { display:flex; flex-direction:column; font-size:12px; color:var(--mute); gap:3px; position:relative; }
    .set-cols { display:flex; flex-wrap:wrap; gap:0 28px; align-items:flex-start; }
    .set-left { flex:0 1 440px; min-width:0; }
    #wx-row select, #wx-row input { max-width:100%; }
    #wx-row select { width:170px; }
    #wx-row > label { min-width:0; }
    .ctl-grid { display:grid; grid-template-columns:auto minmax(0,1fr) minmax(0,1fr); gap:5px 8px; align-items:center; margin-top:10px; max-width:440px; }
    .ctl-head { font-size:12px; color:var(--mute); font-weight:600; }
    .ctl-title { font-size:12px; font-weight:700; color:var(--ink); white-space:nowrap; }
    .ctl-grid select { width:100%; min-width:0; padding:3px 5px; font-size:12px; }
    label > .tip { margin:0; justify-self:start; }
    label:has(> .tip:not(input ~ .tip)) { display:grid; grid-template-columns:auto 1fr; align-items:center; column-gap:3px; }
    label:has(> .tip:not(input ~ .tip)) > select, label:has(> .tip:not(input ~ .tip)) > input { grid-column:1 / -1; }
    label:has(> input[type=checkbox]) > .tip { margin:0 3px; }
    input, select, button { font:inherit; }
    input, select { padding:5px 7px; border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--ink); }
    input[type=number] { width:64px; }
    button { padding:7px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; cursor:pointer; color:var(--ink); }
    button:hover:not(:disabled) { border-color:var(--green); }
    button:disabled { opacity:.45; cursor:default; }
    button.primary { background:var(--green); color:#fff; border-color:var(--green); }
    .teams { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    @media (max-width:1000px) { .teams { grid-template-columns:1fr; } }
    table { border-collapse:collapse; width:100%; }
    th, td { padding:3px 4px; text-align:left; font-size:12px; white-space:nowrap; }
    th { color:var(--mute); font-weight:600; }
    td input[type=text] { width:112px; }
    td input[type=number] { width:50px; padding:3px 4px; }
    td select { padding:3px; }
    td button { padding:1px 6px; }
    .errors { color:#b3392f; margin-top:8px; white-space:pre-line; }
    .game { display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:14px; align-items:start; }
    @media (max-width:1000px) { .game { grid-template-columns:1fr; } }
    canvas { width:100%; display:block; border-radius:8px; background:#e8efe0; }
    #zone-canvas { cursor:crosshair; background:#f1efe6; max-width:340px; margin:0 auto; }
    .score table td, .score table th { text-align:center; font-size:13px; padding:4px 7px; }
    .score table td:first-child, .score table th:first-child { text-align:left; }
    .state { display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
    .dots { display:flex; gap:5px; align-items:center; }
    .dot { width:12px; height:12px; border-radius:50%; border:1.5px solid var(--mute); }
    .dot.on.b { background:var(--green); border-color:var(--green); }
    .dot.on.s { background:var(--accent); border-color:var(--accent); }
    .dot.on.o { background:#b3392f; border-color:#b3392f; }
    .log { height:300px; overflow:auto; font-size:13px; border:1px solid var(--line); border-radius:8px; padding:6px 10px; background:#fff; }
    .log div { padding:2px 0; }
    .log .header { font-weight:700; margin-top:8px; color:var(--green); }
    .log .pitch { color:var(--mute); font-size:12px; }
    .log .scoring { color:var(--accent); font-weight:600; }
    .log .info { color:var(--blue); }
    .muted { color:var(--mute); }
    .pitchinfo { font-weight:600; min-height:20px; }
    .banner { font-size:15px; font-weight:700; }
    .hidden { display:none !important; }
    #field-wrap { position:relative; }
    #bug { position:absolute; left:10px; top:10px; display:flex; font:600 13px/1 system-ui,"Segoe UI",sans-serif; color:#fff; background:rgba(14,24,20,.82); border-radius:6px; box-shadow:0 3px 12px rgba(0,0,0,.35); overflow:hidden; pointer-events:none; user-select:none; }
    #bug .b-teams { display:flex; flex-direction:column; min-width:118px; }
    #bug .b-row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:6px 10px; }
    #bug .b-row + .b-row { border-top:1px solid rgba(255,255,255,.14); }
    #bug .b-row.bat { background:rgba(210,118,55,.9); }
    #bug .b-score { font-size:16px; font-variant-numeric:tabular-nums; }
    #bug .b-mid { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; padding:6px 10px; background:rgba(255,255,255,.08); }
    #bug .b-inn { font-size:12px; letter-spacing:.04em; }
    #bug .b-dots { display:flex; gap:3px; }
    #bug .b-dots i { width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.22); }
    #bug .b-dots i.on { background:#f2c14e; }
    #bug .b-who { display:flex; flex-direction:column; justify-content:center; gap:4px; padding:6px 10px; font-size:12px; font-weight:500; max-width:190px; }
    #bug .b-who span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #bug .b-who b { color:#f2c14e; font-weight:600; margin-right:4px; }
    #zone-overlay { position:absolute; right:12px; bottom:12px; width:300px; padding:8px; border-radius:10px; background:rgba(255,253,247,.88); border:1px solid var(--line); box-shadow:0 4px 18px rgba(0,0,0,.18); opacity:0; pointer-events:none; transition:opacity .7s ease; }
    #zone-overlay.on { opacity:1; pointer-events:auto; transition:opacity .15s ease; }
    #zone-overlay canvas { max-width:none; }
    #pitch-result { position:absolute; left:0; right:0; top:34%; text-align:center; font:900 34px/1 system-ui,sans-serif; letter-spacing:.03em; color:#fff; text-shadow:0 2px 6px rgba(0,0,0,.7); pointer-events:none; z-index:2; }
    #pitch-result[data-kind="b"] { color:#7bd49a; }
    #pitch-result[data-kind="s"] { color:#ff8a6b; }
    #pitch-result[data-kind="f"] { color:#f2c14e; }
    @media (max-width:700px) {
      #bug { font-size:11px; max-width:calc(100% - 20px); }
      #bug .b-row { padding:4px 7px; gap:6px; }
      #bug .b-teams { min-width:78px; }
      #bug .b-who { max-width:120px; padding:4px 7px; font-size:10px; }
      #bug .b-mid { padding:4px 7px; }
      #field-frame { height:62vh !important; min-height:380px; }
      #zone-overlay { width:210px; padding:5px; right:6px; bottom:44px; }
      #pitch-result { font-size:24px; }
      main { padding-left:8px; padding-right:8px; }
    }
    #aim-types { display:flex; gap:5px; flex-wrap:wrap; margin-top:6px; }
    #aim-types button { padding:4px 8px; font-size:12px; }
    #aim-types button.sel { background:var(--accent); color:#fff; border-color:var(--accent); }
    #meter { position:relative; height:18px; margin-top:6px; border-radius:9px; border:1px solid var(--line); background:linear-gradient(90deg,#b3392f 0%,#e0a63b 30%,#29845e 46%,#29845e 54%,#e0a63b 70%,#b3392f 100%); }
    #meter-mark { position:absolute; top:-3px; width:4px; height:24px; background:#1f2a24; border-radius:2px; left:0; }
    .log div.replayable { cursor:pointer; }
    .arch-table { width:100%; border-collapse:collapse; font-size:13px; }
    .arch-table th, .arch-table td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); }
    .arch-view { margin-top:12px; padding-top:10px; border-top:2px solid var(--line); overflow-x:auto; }
    .log div.replayable:hover { background:#eef5ee; }
    .log .sendchart { float:right; padding:0 7px; font-size:11px; line-height:18px; border-radius:6px; margin-left:8px; color:var(--blue); }
    .log .sendchart:disabled { color:var(--mute); cursor:default; }
    #umpbar { position:absolute; left:50%; bottom:10px; transform:translateX(-50%); display:none; align-items:center; gap:10px; padding:7px 12px; border-radius:10px; background:rgba(14,24,20,.9); color:#fff; font-size:13px; box-shadow:0 4px 16px rgba(0,0,0,.35); z-index:5; }
    #umpbar.on { display:flex; }
    #umpbar .tbar { width:90px; height:6px; border-radius:3px; background:rgba(255,255,255,.2); overflow:hidden; }
    #umpbar .tbar i { display:block; height:100%; background:#f2c14e; width:100%; }
    #umpbar button { background:#f2c14e; border-color:#f2c14e; color:#1f2a24; font-weight:600; }
    #chal-menu { position:absolute; left:50%; bottom:56px; transform:translateX(-50%); display:none; flex-direction:column; gap:6px; padding:10px; min-width:260px; border-radius:10px; background:rgba(255,253,247,.97); border:1px solid var(--line); box-shadow:0 6px 22px rgba(0,0,0,.3); z-index:6; }
    #chal-menu.on { display:flex; }
    #btn-challenge.lit { border-color:#f2c14e; color:#1f2a24; background:linear-gradient(90deg,#f2c14e calc(var(--lit,1)*100%),#fffefa 0); box-shadow:0 0 10px rgba(242,193,78,.9); }
    #btn-challenge { transition:box-shadow .3s; }
    #chal-menu button { text-align:left; }
    #chal-menu button:disabled { opacity:.45; cursor:default; }
    #chal-menu .sub { padding-left:14px; display:flex; flex-direction:column; gap:4px; }
    .box h3 { margin:8px 0 4px; font-size:13px; }
    .tip { display:inline-flex; align-items:center; justify-content:center; width:15px; height:15px; margin:0 3px; border-radius:50%; border:1px solid var(--mute); color:var(--mute); font:italic 700 10px/1 Georgia,serif; cursor:help; vertical-align:middle; user-select:none; outline:none; }
    .tip:hover, .tip:focus { background:var(--green); border-color:var(--green); color:#fff; }
    #tip-pop { position:fixed; z-index:1000; max-width:300px; padding:8px 10px; border-radius:8px; background:rgba(14,24,20,.95); color:#fff; font-size:12px; line-height:1.4; box-shadow:0 4px 16px rgba(0,0,0,.35); pointer-events:none; display:none; }
  </style>
</head>
<body>
  <header>
    <div><strong>Field Notes</strong><span>Game mode</span></div>
    <a href="index.html">&larr; Spray chart</a>
  </header>
  <main>
    <section id="setup">
      <div class="card">
        <h2>Game settings</h2>
        <div class="set-cols">
        <div class="set-left">
        <div class="row">
          <label>Ballpark <i class="tip" tabindex="0" data-tip="Sets the fences, foul poles, default altitude and the climate used for weighted-random wind.">i</i> <select id="park"></select></label>
          <label>Innings <i class="tip" tabindex="0" data-tip="Number of innings in a regulation game. Extra innings are played if it is tied.">i</i> <input id="innings" type="number" value="9" min="1" step="1"></label>
          <label>Seed (optional) <i class="tip" tabindex="0" data-tip="Enter a number to make the game's random rolls repeatable. Leave blank for a different game every time.">i</i> <input id="seed" type="number" placeholder="random" style="width:90px"></label>
        </div>
        <div class="ctl-grid">
          <span></span><b class="ctl-head">Away</b><b class="ctl-head">Home</b>
          <span class="ctl-title">Batting <i class="tip" tabindex="0" data-tip="Simulated: the engine swings for the team. I enter EV / LA: you type exit velocity, launch angle and direction for each swing. I swing (timing): move the green ring over where you think the ball will cross the plate and click or press Space as it arrives. The ball breaks late, so don't commit too early, and don't swing to take a pitch. The farther the ball is from the ring's center, the weaker the contact.">i</i></span>
          <select id="ctl-0"><option value="sim">Simulated</option><option value="evla">I enter EV / LA</option><option value="timing">I swing (timing)</option></select>
          <select id="ctl-1"><option value="sim">Simulated</option><option value="evla">I enter EV / LA</option><option value="timing">I swing (timing)</option></select>
          <span class="ctl-title">Pitching <i class="tip" tabindex="0" data-tip="Player Control: you pick the pitch type and spot (control and fatigue add misses). Advanced: same, plus a timing meter that tightens or widens your miss.">i</i></span>
          <select id="pctl-0"><option value="sim">Simulated</option><option value="player">Player Control</option><option value="advanced">Advanced (+ timing meter)</option></select>
          <select id="pctl-1"><option value="sim">Simulated</option><option value="player">Player Control</option><option value="advanced">Advanced (+ timing meter)</option></select>
          <span class="ctl-title">Fielding <i class="tip" tabindex="0" data-tip="Simulated: the CPU chooses every throw. I pick throws: when the ball is fielded you choose the target (1B / 2B / 3B / HOME / HOLD, keys 1-4, H, A). Unanswered decisions use the AI's choice.">i</i></span>
          <select id="fctl-0"><option value="sim">Simulated</option><option value="manual">I pick throws</option></select>
          <select id="fctl-1"><option value="sim">Simulated</option><option value="manual">I pick throws</option></select>
          <span class="ctl-title">Coaching <i class="tip" tabindex="0" data-tip="Simulated: the coach makes pinch hits, pinch runs, defensive changes and pitching changes. Manual: you make them yourself; substitutions are permanent, and plate-appearance, half-inning and game buttons pause after every batter so you can make changes.">i</i></span>
          <select id="coach-0"><option value="sim">Simulated</option><option value="manual">Manual</option></select>
          <select id="coach-1"><option value="sim">Simulated</option><option value="manual">Manual</option></select>
        </div>
        </div>
        <div class="row" id="wx-row" style="align-items:flex-start;flex:1 1 340px;margin-top:10px">
          <label>Wind <i class="tip" tabindex="0" data-tip="Calm: no wind. I set it: choose speed and direction yourself. Random: any speed and direction. Random, weighted: draws from the park's real typical wind. Wind pushes batted balls, so a tailwind helps homers and a headwind knocks them down.">i</i>
            <select id="wx-mode">
              <option value="calm">Calm</option>
              <option value="fixed">I set it</option>
              <option value="random">Random</option>
              <option value="park">Random, weighted to the park's real climate</option>
            </select>
          </label>
          <label>Wind changes <i class="tip" tabindex="0" data-tip="Steady: constant all game. Gusty: small gusts and slow drift. Re-rolled each inning: a new wind is drawn at the start of every inning.">i</i>
            <select id="wx-var">
              <option value="steady">Steady</option>
              <option value="gusty">Gusty (small gusts and drift)</option>
              <option value="inning">Re-rolled each inning</option>
            </select>
          </label>
          <label>Altitude (ft) <i class="tip" tabindex="0" data-tip="Thinner air at altitude means less drag, so balls carry farther. Leave blank to use the park's real elevation.">i</i> <input id="wx-alt" type="number" step="any" placeholder="park default" style="width:120px"></label>
          <label>Roof <i class="tip" tabindex="0" data-tip="Only matters at parks with a retractable roof. A closed roof means no wind.">i</i> <select id="wx-roof"><option value="closed">Closed</option><option value="open">Open</option></select></label>
          <div id="wx-fixed" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
            <label>Speed (mph) <input id="wx-speed" type="number" step="any" value="10" style="width:80px"></label>
            <label>Blowing from (°) <i class="tip" tabindex="0" data-tip="Compass-style direction the wind comes from, relative to the field. You can also click or drag on the dial.">i</i> <input id="wx-from" type="number" step="any" value="225" style="width:80px"></label>
            <div style="text-align:center">
              <svg id="wx-dial" width="130" height="130" viewBox="-85 -85 170 170" style="cursor:pointer;touch-action:none;display:block"></svg>
              <div style="display:flex;gap:3px;justify-content:center;margin-top:4px" id="wx-micro"></div>
            </div>
          </div>
          <div class="muted" id="wx-note" style="flex-basis:100%"></div>
        </div>
        </div>
        <div class="muted" style="margin-top:6px">Team ratings <i class="tip" tabindex="0" data-tip="Ratings start at 0 with no cap: 50 is an average MLB player and the best in each category are around 100. OVR is a weighted average of the ratings (risk is left out).">i</i> · Bench <i class="tip" tabindex="0" data-tip="Bench players can be used for pinch hitting, pinch running and defensive changes, by a simulated coach or by you.">i</i> · Lineup <i class="tip" tabindex="0" data-tip="One each of C, 1B, 2B, 3B, SS, LF, CF, RF and DH. Lineup order is top to bottom; the first pitcher starts.">i</i> · Replays <i class="tip" tabindex="0" data-tip="Click any ▶ play in the log to replay it.">i</i></div>
      </div>
      <div class="teams" id="teams"></div>
      <div class="card" style="margin-top:14px">
        <div class="errors" id="errors" style="margin:0 0 8px"></div>
        <button class="primary" id="start">Play ball</button>
      </div>
      <div class="card" style="margin-top:14px">
        <h3 style="margin:0 0 8px">Game archive <span class="muted" id="archive-count"></span> <i class="tip" tabindex="0" data-tip="Every finished game is saved here automatically with its line score, box score, full play log and balls in play. Open one to read it, send its balls to the spray chart, or download it as JSON. Archives live in this browser's storage.">i</i></h3>
        <div id="archive"></div>
      </div>
    </section>

    <section id="play" class="hidden">
      <div class="game">
        <div>
          <div class="card">
            <div id="field-wrap">
              <iframe id="field-frame" title="3D field" src="index.html?embed=1&amp;game=1&amp;park=dodgers" style="width:100%;height:640px;border:0;border-radius:8px;display:block"></iframe>
              <div id="bug"></div>
              <div id="umpbar"><span id="ump-text"></span><div class="tbar"><i id="ump-bar"></i></div><button id="ump-btn">Challenge</button></div>
              <div id="chal-menu"></div>
              <div id="zone-overlay">
                <div id="pitch-result"></div>                <canvas id="zone-canvas" width="340" height="400"></canvas>
                <div id="aim-ui" class="hidden">
                  <div id="aim-types"></div>
                  <div id="meter" class="hidden"><div id="meter-mark"></div></div>
                  <div class="row" style="margin-top:6px"><button class="primary" id="btn-throw">Throw</button><span class="muted" id="aim-help"></span></div>
                </div>
              </div>
            </div>
            <div class="row" style="margin-top:8px">
              <button class="primary" id="btn-pitch">Next pitch</button>
              <button id="btn-pa">Sim At-Bat</button>
              <button id="btn-half">Sim Half-Inning</button>
              <button id="btn-game">Sim to end</button>
              <i class="tip" tabindex="0" data-tip="Next pitch: play one pitch. Sim At-Bat / Sim Half-Inning / Sim to end: simulate that much, animating every plate appearance. Watch every pitch shows each pitch from the mound with the call popup; At-bat results only shows just the result of each at-bat. Skip animations jumps ahead.">i</i>
              <select id="watch-mode" title="What to animate when simming">
                <option value="every">Watch every pitch</option>
                <option value="pa">At-bat results only</option>
              </select>
              <button id="btn-skip" class="hidden">Skip animations</button>
              <button id="btn-replay">Replay last ball</button>
              <button id="btn-challenge" disabled>Challenge</button>
              <span class="muted" id="chal-left"></span>
            </div>
            <div class="row hidden" id="steal-row" style="margin-top:8px"></div>
            <div id="coach-panel" class="hidden" style="margin-top:8px;padding:8px 10px;border:1px solid #0002;border-radius:8px"></div>
            <div class="row" id="shift-row" style="margin-top:8px"></div>
            <div class="row hidden" id="shift-custom" style="margin-top:6px"></div>
            <div class="pitchinfo" id="pitch-info" style="margin-top:8px"></div>
            <div class="row" id="relay-row" style="margin-top:6px"><label><input type="checkbox" id="relay-on"> Throw via cutoff man (relay, key R) <i class="tip" tabindex="0" data-tip="Routes your next throw through the cutoff man instead of throwing directly. Useful on long outfield throws.">i</i></label><span class="muted" id="relay-hint"></span></div>
            <div class="row hidden" id="evla" style="margin-top:8px">
              <label>Exit velo (mph) <input id="in-ev" type="number" value="95" step="any"></label>
              <label>Launch angle (°) <input id="in-la" type="number" value="15" step="any"></label>
              <label>Direction (° 0 = CF) <input id="in-dir" type="number" value="0" step="any"></label>
              <button class="primary" id="btn-hit">Hit it</button>
              <button id="btn-take">Take</button>
              <button id="btn-whiff">Swing &amp; miss</button>
              <button id="btn-simswing">Let sim swing</button>
            </div>
            <div class="hidden" id="timing-help" style="margin-top:6px">
              <label class="muted">Pitch speed <i class="tip" tabindex="0" data-tip="How fast the pitch arrives when you swing with timing. Rookie is slow motion; Real speed is the true pitch speed. Move the green ring over where you think the ball will cross the plate and click (or press Space) as it arrives. The ball breaks late, so don't commit too early. Don't swing to take the pitch. The farther the ball is from the ring's center, the weaker the contact.">i</i> <select id="difficulty"><option value="rookie">Rookie (slow-mo)</option><option value="pro" selected>Pro</option><option value="allstar">All-Star</option><option value="real">Real speed</option></select></label>
            </div>
            <div class="row" style="margin-top:10px">
              <label class="muted">Baserunning / throw decisions <i class="tip" tabindex="0" data-tip="Batting: click GO / STOP / TURN BACK by the base your runner is approaching (keys G / S / B). Fielding: pick the throw target as the fielder gets to the ball. Real-time keeps the play moving; Pause stops it for each decision. Unanswered decisions use the AI's choice.">i</i> <select id="decision"><option value="real" selected>Real-time</option><option value="pause">Pause for each decision</option></select></label>
              <span class="muted">Camera <i class="tip" tabindex="0" data-tip="Drag to orbit · Shift/right-drag to pan · Scroll to zoom">i</i></span>
              <span class="muted">Umpires <i class="tip" tabindex="0" data-tip="Umpires can miss calls. When one goes against a team you control, press the glowing Challenge button within 1 s (ball/strike) or 8 s (safe/out, fair/foul) and choose what to challenge; ignore it and it fades. A failed challenge costs one (2 ABS and 1 field per team per game); overturning a bad call is free.">i</i></span>
            </div>
            <div class="banner" id="banner" style="margin-top:8px">&nbsp;</div>
          </div>
          <div class="card">
            <div class="row" style="margin-bottom:8px">
              <label>Play log <select id="log-inning"></select></label>
              <span class="muted">Replay <i class="tip" tabindex="0" data-tip="Click a ▶ play in the log to replay it.">i</i></span>
            </div>
            <div class="log" id="log"></div>
            <div class="row" style="margin-top:10px">
              <button id="btn-export">Send balls to spray chart</button>
              <button id="btn-new">New game</button>
            </div>
          </div>
          <div class="card box" id="box"></div>
        </div>
        <div>
          <div class="card score" id="score"></div>
          <div class="card">
            <div class="state">
              <div id="inning-label" class="banner"></div>
              <div><span class="muted">Balls</span> <span class="dots" id="dots-b"></span></div>
              <div><span class="muted">Strikes</span> <span class="dots" id="dots-s"></span></div>
              <div><span class="muted">Outs</span> <span class="dots" id="dots-o"></span></div>
            </div>
            <div style="margin-top:8px" id="matchup" class="muted"></div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div id="tip-pop" role="tooltip"></div>
  <script>
    (() => {
      const pop = document.getElementById("tip-pop");
      const show = (el) => {
        pop.textContent = el.dataset.tip;
        pop.style.display = "block";
        const r = el.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
        const left = Math.max(6, Math.min(innerWidth - w - 6, r.left + r.width / 2 - w / 2));
        const top = r.bottom + 8 + h > innerHeight ? r.top - h - 8 : r.bottom + 8;
        pop.style.left = left + "px";
        pop.style.top = Math.max(6, top) + "px";
      };
      const hide = () => { pop.style.display = "none"; };
      const tipOf = (e) => e.target.closest && e.target.closest(".tip");
      document.addEventListener("mouseover", (e) => { const t = tipOf(e); if (t) show(t); });
      document.addEventListener("mouseout", (e) => { if (tipOf(e)) hide(); });
      document.addEventListener("focusin", (e) => { const t = tipOf(e); if (t) show(t); });
      document.addEventListener("focusout", (e) => { if (tipOf(e)) hide(); });
      document.addEventListener("click", (e) => { const t = tipOf(e); if (t) { e.preventDefault(); show(t); } });
    })();
  </script>
  <script src="park-walls.js"></script>
  <script src="players-data.js" onerror="void 0"></script>
  <script src="game-engine.js"></script>
  <script>
  (() => {
    const E = window.GameEngine;
    const $ = (id) => document.getElementById(id);
    const TEAMS_KEY = "field-notes-game-teams-v1";
    const SPRAY_KEY = "field-notes-spray-chart-v1";
    const POS_OPTIONS = [...E.POSITIONS, "DH"];
    const BAT_KEYS = ["contact", "power", "eye", "speed", "arm", "field", "risk"];
    const PITCH_KEYS = ["velo", "control", "movement", "stamina"];

    let teams;
    let game = null;
    let controls = ["sim", "sim"];
    let pitchControls = ["sim", "sim"];
    let fieldControls = ["sim", "sim"];
    let replays = new Map();
    let flight = null;
    let aim = null;
    let logKey = "";
    let logSel = null;
    let phase = "ready"; // ready | await (user pitch in flight / awaiting input)
    let timing = null;
    let lastBall = null;
    let lastZone = null;

    /* ------------------------------------------------------------ setup */

    for (const park of E.PARK_LIST) $("park").add(new Option(park.name, park.id));
    $("park").value = "dodgers";

    /* ------------------------------------------------------------ weather setup */

    const COMPASS = ["N", "NNE", "NE", "ENE", "E", "ESE", "SE", "SSE", "S", "SSW", "SW", "WSW", "W", "WNW", "NW", "NNW"];
    const compassName = (deg) => COMPASS[Math.round((((deg % 360) + 360) % 360) / 22.5) % 16];
    const bearingPoint = (deg, r) => [Math.sin(deg * Math.PI / 180) * r, -Math.cos(deg * Math.PI / 180) * r];
    const readFrom = () => ((Number($("wx-from").value) || 0) % 360 + 360) % 360;

    function wxRender() {
      const info = E.parkEnv(E.parkById($("park").value));
      const mode = $("wx-mode").value;
      const from = readFrom();
      $("wx-fixed").style.display = mode === "fixed" ? "flex" : "none";
      $("wx-var").disabled = mode === "calm";
      const retract = info.roof === "retractable";
      $("wx-roof").disabled = !retract;
      $("wx-alt").placeholder = `park default: ${info.alt}`;
      let svg = `<circle r="70" fill="rgba(0,0,0,.04)" stroke="rgba(0,0,0,.35)"/>`;
      for (let d = 0; d < 360; d += 15) {
        const [x1, y1] = bearingPoint(d, 70);
        const [x2, y2] = bearingPoint(d, d % 90 === 0 ? 62 : d % 45 === 0 ? 65 : 67);
        svg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="rgba(0,0,0,.45)"/>`;
      }
      [["N", 0], ["E", 90], ["S", 180], ["W", 270]].forEach(([n, d]) => {
        const [x, y] = bearingPoint(d, 54);
        svg += `<text x="${x}" y="${y + 4}" fill="#444" font-size="11" text-anchor="middle">${n}</text>`;
      });
      // The field: a wedge from home plate out toward center field.
      const a = bearingPoint(info.cf - 45, 46);
      const b = bearingPoint(info.cf + 45, 46);
      svg += `<path d="M0 0 L${a[0]} ${a[1]} A46 46 0 0 1 ${b[0]} ${b[1]} Z" fill="rgba(80,170,90,.35)" stroke="#5db36b"/>`;
      [["LF", -40], ["CF", 0], ["RF", 40]].forEach(([n, o]) => {
        const [x, y] = bearingPoint(info.cf + o, 33);
        svg += `<text x="${x}" y="${y + 3}" fill="#1d5a2b" font-size="9" text-anchor="middle">${n}</text>`;
      });
      if (mode === "fixed") {
        const tail = bearingPoint(from, 62);
        const tip = bearingPoint(from + 180, 62);
        svg += `<line x1="${tail[0]}" y1="${tail[1]}" x2="${tip[0]}" y2="${tip[1]}" stroke="#f2c14e" stroke-width="3"/>`;
        const h1 = bearingPoint(from + 180 - 150, 14);
        const h2 = bearingPoint(from + 180 + 150, 14);
        svg += `<path d="M${tip[0]} ${tip[1]} l${h1[0]} ${h1[1]} M${tip[0]} ${tip[1]} l${h2[0]} ${h2[1]}" stroke="#f2c14e" stroke-width="3" fill="none"/>`;
        svg += `<circle cx="${tail[0]}" cy="${tail[1]}" r="4" fill="#f2c14e"/>`;
      }
      $("wx-dial").innerHTML = svg;
      const alt = $("wx-alt").value.trim() === "" ? info.alt : Number($("wx-alt").value) || 0;
      const rho = E.airDensity(alt);
      let text = `Altitude ${Math.round(alt).toLocaleString()} ft: air ${Math.round(rho * 100)}% as dense as sea level. `;
      if (info.roof === "dome") text += "Fixed dome: no wind. ";
      else if (retract && $("wx-roof").value === "closed") text += "Roof closed: no wind. ";
      if (mode === "fixed") {
        const w = E.windVector(Number($("wx-speed").value) || 0, from, info.cf);
        text += `Wind ${$("wx-speed").value || 0} mph from the ${compassName(from)} (${Math.round(from)}°) = ${E.windText(w)}. This park's center field faces ${compassName(info.cf)} (${info.cf}°).`;
      } else if (mode === "park") text += `Typical wind here: about ${info.mph} mph from the ${compassName(info.from)}.`;
      else if (mode === "random") text += "Wind speed and direction are rolled at random.";
      $("wx-note").textContent = text;
    }
    [["-15", -15], ["-5", -5], ["-1", -1], ["+1", 1], ["+5", 5], ["+15", 15]].forEach(([label, step]) => {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = label + "°";
      button.style.cssText = "padding:2px 6px;font-size:11px";
      button.addEventListener("click", () => {
        $("wx-from").value = Math.round((((readFrom() + step) % 360) + 360) % 360 * 100) / 100;
        wxRender();
      });
      $("wx-micro").append(button);
    });
    const dialSet = (event) => {
      const box = $("wx-dial").getBoundingClientRect();
      const dx = event.clientX - (box.left + box.width / 2);
      const dy = event.clientY - (box.top + box.height / 2);
      $("wx-from").value = Math.round((Math.atan2(dx, -dy) * 180 / Math.PI + 360) % 360);
      wxRender();
    };
    let dialDrag = false;
    $("wx-dial").addEventListener("pointerdown", (event) => { dialDrag = true; $("wx-dial").setPointerCapture(event.pointerId); dialSet(event); });
    $("wx-dial").addEventListener("pointermove", (event) => { if (dialDrag) dialSet(event); });
    $("wx-dial").addEventListener("pointerup", () => { dialDrag = false; });
    ["park", "wx-mode", "wx-var", "wx-alt", "wx-roof", "wx-speed", "wx-from"].forEach((id) => {
      $(id).addEventListener("input", wxRender);
      $(id).addEventListener("change", wxRender);
    });
    wxRender();

    const DEFAULT_COLORS = ["#2b6fa6", "#d27637"];
    const autoAbbr = (name) => (String(name).replace(/[^A-Za-z0-9 ]/g, "").trim().split(/\s+/).map((w) => w[0]).join("").slice(0, 3) || String(name).slice(0, 3)).toUpperCase();
    const withMeta = (fresh, old, index) => {
      fresh.abbr = old && old.abbr !== undefined ? old.abbr : (fresh.abbr || "");
      fresh.color = (old && old.color) || fresh.color || DEFAULT_COLORS[index];
      return fresh;
    };
    const teamAbbr = (team) => (String(team.abbr || "").trim() || autoAbbr(team.name)).toUpperCase().slice(0, 4);
    const inkOn = (hex) => {
      const n = parseInt(String(hex).replace("#", ""), 16) || 0;
      return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) > 150 ? "#1c2a21" : "#fff";
    };

    // Teams saved before the open-ended rating scale (v2) used 20-80 and mph; convert them once.
    function migrateTeam(team, index) {
      if (team.abbr === undefined) team.abbr = "";
      if (!team.color) team.color = DEFAULT_COLORS[index] || DEFAULT_COLORS[0];
      if (team.scale !== 2) {
        const up = (v) => Math.max(0, Math.round(50 + ((Number(v) || 50) - 50) / 0.6));
        for (const p of team.lineup) for (const key of BAT_KEYS) p[key] = up(p[key]);
        for (const p of team.pitchers) {
          for (const key of ["control", "movement", "stamina"]) p[key] = up(p[key]);
          p.velo = E.mphToVelo(Number(p.velo) || 92);
        }
        team.scale = 2;
      }
      if (!team.bench) team.bench = E.generateTeam(team.name, team.style, Math.floor(Math.random() * 1e6)).bench;
      team.scale = 2;
      for (const p of team.lineup) for (const key of BAT_KEYS) if (!Number.isFinite(Number(p[key]))) p[key] = 50;
      for (const p of team.bench) for (const key of BAT_KEYS) if (!Number.isFinite(Number(p[key]))) p[key] = 50;
      return team;
    }

    function loadTeams() {
      try {
        const saved = JSON.parse(localStorage.getItem(TEAMS_KEY));
        if (saved && saved.length === 2) return saved.map((t, i) => migrateTeam(t, i));
      } catch (error) { /* fall through */ }
      return [withMeta(E.generateTeam("Away", "balanced", Date.now() % 100000), null, 0), withMeta(E.generateTeam("Home", "balanced", (Date.now() + 7) % 100000), null, 1)];
    }
    teams = loadTeams();
    const saveTeams = () => { try { localStorage.setItem(TEAMS_KEY, JSON.stringify(teams)); } catch (error) { /* ignore */ } };

    const f1 = (v) => (Math.round(v * 10) / 10).toFixed(1);
    // Recomputes every OVR cell and team rating strip in place (so typing never loses focus).
    function updateRatings() {
      document.querySelectorAll("[data-ovr]").forEach((el) => {
        const [ti, kind, i] = el.dataset.ovr.split(":");
        const player = kind === "p" ? teams[ti].pitchers[i] : kind === "b" ? teams[ti].bench[i] : teams[ti].lineup[i];
        if (!player) return;
        el.textContent = Math.round(kind === "p" ? E.pitcherOverall({ ...player, role: i == 0 ? "SP" : "RP" }) : E.batterOverall(player));
      });
      document.querySelectorAll("[data-teamrate]").forEach((el) => {
        const team = teams[el.dataset.teamrate];
        const t = E.teamRatings({ lineup: team.lineup, pitchers: team.pitchers.map((p, i) => ({ ...p, role: i === 0 ? "SP" : "RP" })) });
        const pill = (label, value, big) => `<span style="${big ? "font-weight:700;font-size:15px;" : ""}margin-right:14px"><span class="muted">${label}</span> ${Math.round(value)}</span>`;
        el.innerHTML = `<div>${pill("TEAM OVR", t.ovr, true)}${pill("Offense", t.off)}${pill("Defense", t.def)}${pill("Pitching", t.pit)}</div>`
          + `<div class="muted" style="font-size:12px;margin-top:2px">Hitters avg: CON ${Math.round(t.hit.contact)} · PWR ${Math.round(t.hit.power)} · EYE ${Math.round(t.hit.eye)} · SPD ${Math.round(t.hit.speed)} · ARM ${Math.round(t.field.arm)} · FLD ${Math.round(t.field.field)}</div>`
          + `<div class="muted" style="font-size:12px">Staff avg (SP 50% / bullpen 50%): VELO ${Math.round(t.pitch.velo)} · CTL ${Math.round(t.pitch.control)} · MOV ${Math.round(t.pitch.movement)} · STA ${Math.round(t.pitch.stamina)}</div>`;
      });
    }

    function numInput(obj, key) {
      const input = document.createElement("input");
      input.type = "number";
      input.step = "any";
      input.min = "0";
      input.value = obj[key];
      input.addEventListener("input", () => { obj[key] = Number(input.value); updateRatings(); });
      input.addEventListener("change", () => { obj[key] = Number(input.value); saveTeams(); updateRatings(); });
      return input;
    }
    function textInput(obj, key, width) {
      const input = document.createElement("input");
      input.type = "text";
      input.value = obj[key];
      if (width) input.style.width = width;
      input.addEventListener("change", () => { obj[key] = input.value; saveTeams(); });
      return input;
    }
    function selectInput(obj, key, options) {
      const select = document.createElement("select");
      for (const option of options) select.add(new Option(option, option));
      select.value = obj[key];
      select.addEventListener("change", () => { obj[key] = select.value; saveTeams(); });
      return select;
    }
    function cell(row, node) { const td = row.insertCell(); td.append(node); return td; }
    // Position dropdown plus a badge showing the FLD lost when the player isn't natural at that spot.
    function posCell(row, player) {
      if (!player.natural) player.natural = player.pos;
      const td = cell(row, selectInput(player, "pos", POS_OPTIONS));
      const badge = document.createElement("span");
      badge.style.cssText = "font-size:11px;color:#b3392f;margin-left:4px;white-space:nowrap";
      const update = () => {
        const pen = E.positionPenalty(player, player.pos);
        badge.textContent = pen ? `−${pen} FLD` : "";
        badge.title = pen ? `${player.natural} playing ${player.pos}: FLD drops by ${pen} in game (other ratings unchanged).` : "";
        const alts = (player.alt || []).filter((p) => p !== player.pos);
        td.title = `Natural: ${player.natural}${alts.length ? " · also plays " + alts.join(", ") : ""}`;
      };
      update();
      td.firstChild.addEventListener("change", update);
      td.append(badge);
    }

    /* Real MLB players (players-data.js, built by build-players.js from Baseball Savant). */
    const plain = (s) => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    function playerSearch(team, ti) {
      const data = window.MLB_PLAYERS;
      const box = document.createElement("div");
      box.style.cssText = "margin-top:10px";
      const input = document.createElement("input");
      input.type = "search";
      input.placeholder = `Search ${data.year} MLB players (name or team)…`;
      input.style.cssText = "width:100%;max-width:340px";
      const results = document.createElement("div");
      results.style.cssText = "margin-top:6px";

      const mlbTeams = [...new Set(data.batters.map((p) => p.team).filter(Boolean))]
        .filter((t) => data.batters.filter((p) => p.team === t).length >= 9 && data.pitchers.some((p) => p.team === t)).sort();
      const teamRow = document.createElement("div");
      teamRow.className = "row";
      teamRow.style.cssText = "margin:0 0 8px;gap:6px";
      const teamSel = document.createElement("select");
      mlbTeams.forEach((t) => teamSel.add(new Option(t, t)));
      if (team.club && mlbTeams.includes(team.club)) teamSel.value = team.club;
      teamSel.addEventListener("change", () => { team.club = teamSel.value; saveTeams(); });
      const teamBtn = document.createElement("button");
      teamBtn.textContent = "Load best lineup";
      teamBtn.addEventListener("click", () => {
        Object.assign(team, bestMlbTeam(teamSel.value));
        const club = MLB_CLUBS[teamSel.value];
        team.abbr = teamSel.value;
        team.club = teamSel.value;
        if (club) { team.name = club[0]; team.color = club[1]; }
        saveTeams();
        renderTeams();
      });
      const teamTip = document.createElement("i");
      teamTip.className = "tip";
      teamTip.tabIndex = 0;
      teamTip.textContent = "i";
      teamTip.dataset.tip = "Replaces this team's lineup, bench and pitchers with the best arrangement of a real MLB team's players: each position goes to the best natural fielder there (DH to the best leftover bat), the batting order is built from the ratings, the bench covers catcher, infield and outfield, and the staff is the top starter plus the best relievers. Team name, abbreviation and color are set to the club's too.";
      teamRow.append("Import whole team", teamSel, teamBtn, teamTip);
      box.append(teamRow, input, results);

      const pool = [
        ...data.batters.map((p) => ({ ...p, kind: "bat", key: plain(`${p.name} ${p.team}`) })),
        ...data.pitchers.map((p) => ({ ...p, kind: "pit", key: plain(`${p.name} ${p.team}`) }))
      ];
      const fmt = (v, d = 3) => (v === null || v === undefined ? "–" : Number(v).toFixed(d).replace(/^0\./, "."));

      function addBatter(p, slot) {
        const next = {
          name: p.name, bats: p.bats, contact: p.contact, power: p.power, eye: p.eye,
          speed: p.speed, arm: p.arm, field: p.field, risk: p.risk, loft: p.loft, mlb: p.id, natural: p.pos, alt: p.alt || []
        };
        if (slot === -2) team.bench.push({ ...next, pos: p.pos });
        else team.lineup[slot] = { ...next, pos: team.lineup[slot].pos };
      }
      function addPitcher(p, slot) {
        const next = { name: p.name, role: slot === 0 ? "SP" : "RP", throws: p.throws, velo: p.velo, control: p.control, movement: p.movement, stamina: p.stamina, mlb: p.id };
        if (slot < 0) team.pitchers.push(next);
        else team.pitchers[slot] = next;
      }

      function show() {
        results.innerHTML = "";
        const words = plain(input.value).split(/\s+/).filter(Boolean);
        if (!words.length) return;
        const hits = pool.filter((p) => words.every((w) => p.key.includes(w)))
          .sort((a, b) => (b.kind === "bat" ? b.pa : b.ip * 4) - (a.kind === "bat" ? a.pa : a.ip * 4)).slice(0, 8);
        if (!hits.length) { results.textContent = "No match."; return; }
        for (const p of hits) {
          const line = document.createElement("div");
          line.style.cssText = "display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:4px 0;border-bottom:1px solid #0001;font-size:13px";
          const info = document.createElement("span");
          info.style.cssText = "flex:1 1 220px";
          info.innerHTML = p.kind === "bat"
            ? `<b>${esc(p.name)}</b> ${esc(p.team)} · ${p.pos} · ${p.bats} · ${fmt(p.stat.avg)}/${fmt(p.stat.obp)}/${fmt(p.stat.slg)}, ${p.stat.hr ?? 0} HR<br>            <small>OVR ${Math.round(E.batterOverall(p))} · CON ${p.contact} PWR ${p.power} EYE ${p.eye} SPD ${p.speed} ARM ${p.arm} FLD ${p.field}</small>`
            : `<b>${esc(p.name)}</b> ${esc(p.team)} · ${p.role} · ${p.throws}HP · ${p.stat.era ?? "–"} ERA<br><small>OVR ${Math.round(E.pitcherOverall(p))} · VELO ${p.velo} CTL ${p.control} MOV ${p.movement} STA ${p.stamina}</small>`;
          const slot = document.createElement("select");
          if (p.kind === "bat") {
            team.lineup.forEach((q, i) => slot.add(new Option(`Replace ${i + 1}. ${q.name} (${q.pos})`, i)));
            slot.add(new Option("Add to bench", -2));
            const same = team.lineup.findIndex((q) => q.pos === p.pos);
            slot.value = same >= 0 ? same : 0;
          } else {
            team.pitchers.forEach((q, i) => slot.add(new Option(`Replace ${i === 0 ? "SP" : "RP"}: ${q.name}`, i)));
            slot.add(new Option("Add as reliever", -1));
            slot.value = p.role === "SP" ? 0 : -1;
          }
          const add = document.createElement("button");
          add.textContent = "Add";
          add.addEventListener("click", () => {
            (p.kind === "bat" ? addBatter : addPitcher)(p, Number(slot.value));
            saveTeams();
            renderTeams();
          });
          line.append(info, slot, add);
          results.append(line);
        }
      }
      input.addEventListener("input", show);
      return box;
    }

    const MLB_CLUBS = {
      ATH: ["Athletics", "#006a4e"], ATL: ["Atlanta Braves", "#ce1141"], AZ: ["Arizona Diamondbacks", "#a71930"],
      BAL: ["Baltimore Orioles", "#df4601"], BOS: ["Boston Red Sox", "#bd3039"], CHC: ["Chicago Cubs", "#0e3386"],
      CIN: ["Cincinnati Reds", "#c6011f"], CLE: ["Cleveland Guardians", "#00385d"], COL: ["Colorado Rockies", "#33006f"],
      CWS: ["Chicago White Sox", "#27251f"], DET: ["Detroit Tigers", "#0c2340"], HOU: ["Houston Astros", "#eb6e1f"],
      KC: ["Kansas City Royals", "#004687"], LAA: ["Los Angeles Angels", "#ba0021"], LAD: ["Los Angeles Dodgers", "#005a9c"],
      MIA: ["Miami Marlins", "#00a3e0"], MIL: ["Milwaukee Brewers", "#12284b"], MIN: ["Minnesota Twins", "#002b5c"],
      NYM: ["New York Mets", "#ff5910"], NYY: ["New York Yankees", "#0c2340"], PHI: ["Philadelphia Phillies", "#e81828"],
      PIT: ["Pittsburgh Pirates", "#fdb827"], SD: ["San Diego Padres", "#2f241d"], SEA: ["Seattle Mariners", "#005c5c"],
      SF: ["San Francisco Giants", "#fd5a1e"], STL: ["St. Louis Cardinals", "#c41e3a"], TB: ["Tampa Bay Rays", "#092c5c"],
      TEX: ["Texas Rangers", "#003278"], TOR: ["Toronto Blue Jays", "#134a8e"], WSH: ["Washington Nationals", "#ab0003"]
    };

    /* Best lineup, bench and staff from one real MLB team's players. */
    function bestMlbTeam(code) {
      const data = window.MLB_PLAYERS;
      const ovr = (p) => E.batterOverall(p);
      const bats = data.batters.filter((p) => p.team === code).sort((a, b) => ovr(b) - ovr(a));
      const toBatter = (p, pos) => ({
        name: p.name, pos, bats: p.bats, contact: p.contact, power: p.power, eye: p.eye,
        speed: p.speed, arm: p.arm, field: p.field, risk: p.risk, loft: p.loft, mlb: p.id, natural: p.pos, alt: p.alt || []
      });
      const toPitcher = (p, role) => ({ name: p.name, role, throws: p.throws, velo: p.velo, control: p.control, movement: p.movement, stamina: p.stamina, mlb: p.id });
      const left = bats.slice();
      const take = (p) => { left.splice(left.indexOf(p), 1); return p; };
      const spots = {};
      // Fill the scarcest positions first so a catcher or shortstop isn't lost to a stronger hitter elsewhere.
      const order = ["C", "SS", "CF", "2B", "3B", "RF", "LF", "1B"].sort((a, b) => left.filter((p) => p.pos === a).length - left.filter((p) => p.pos === b).length);
      for (const pos of order) {
        const natural = left.find((p) => p.pos === pos);
        if (natural) spots[pos] = take(natural);
      }
      const dh = left.find((p) => p.pos === "DH") || left[0];
      if (dh) spots.DH = take(dh);
      // Missing positions go to the best leftover who is eligible there, else the one who loses the least FLD.
      for (const pos of ["C", "SS", "CF", "2B", "3B", "RF", "LF", "1B", "DH"]) {
        if (spots[pos] || !left.length) continue;
        const pick = pos === "DH" ? left[0] : left.slice().sort((a, b) => E.positionPenalty(a, pos) - E.positionPenalty(b, pos) || ovr(b) - ovr(a))[0];
        spots[pos] = take(pick);
      }
      const chosen = Object.entries(spots).map(([pos, p]) => ({ p, pos }));
      if (chosen.length < 9) {
        const all = data.batters.slice().sort((a, b) => ovr(b) - ovr(a));
        for (const pos of ["C", "SS", "CF", "2B", "3B", "RF", "LF", "1B", "DH"]) {
          if (spots[pos]) continue;
          const p = all.find((q) => !chosen.some((c) => c.p === q) && (q.pos === pos || pos === "DH"));
          if (p) chosen.push({ p, pos });
        }
      }
      const batOrder = [];
      const pull = (score) => {
        const best = chosen.filter((c) => !batOrder.includes(c)).sort((a, b) => score(b.p) - score(a.p))[0];
        if (best) batOrder.push(best);
      };
      pull((p) => p.contact + p.eye * 1.2 + p.speed * 0.5);
      pull(ovr);
      pull(ovr);
      pull((p) => p.power * 1.5 + p.contact);
      while (batOrder.length < chosen.length) pull((p) => p.contact + p.power + p.eye);
      const lineup = batOrder.map((c) => toBatter(c.p, c.pos));

      const bench = [];
      const benchPick = (test) => {
        const p = left.find(test);
        if (p) bench.push(toBatter(take(p), p.pos));
      };
      benchPick((p) => E.eligibleAt(p, "C"));
      benchPick((p) => ["SS", "2B", "3B"].some((q) => E.eligibleAt(p, q)));
      benchPick((p) => ["CF", "LF", "RF"].some((q) => E.eligibleAt(p, q)));
      benchPick((p) => p.speed >= 60);
      while (bench.length < 5 && left.length) benchPick(() => true);

      const pits = data.pitchers.filter((p) => p.team === code).sort((a, b) => E.pitcherOverall(b) - E.pitcherOverall(a));
      const sp = pits.find((p) => p.role === "SP") || pits[0];
      const pitchers = [];
      if (sp) pitchers.push(toPitcher(sp, "SP"));
      pits.filter((p) => p !== sp).slice(0, 5).forEach((p) => pitchers.push(toPitcher(p, "RP")));
      return { lineup, bench, pitchers };
    }

    /* Random team of real MLB players, either uniformly random or weighted toward higher-rated players. */
    function mlbTeam(team, weighted) {
      const data = window.MLB_PLAYERS;
      const weight = (ovr) => (weighted ? Math.pow(Math.max(ovr, 1) / 50, 4) : 1);
      const draw = (list, score) => {
        if (!list.length) return null;
        const w = list.map(score);
        let r = Math.random() * w.reduce((a, b) => a + b, 0);
        for (let i = 0; i < list.length; i++) { r -= w[i]; if (r <= 0) return list.splice(i, 1)[0]; }
        return list.pop();
      };
      const bats = data.batters.map((p) => ({ p, w: weight(E.batterOverall(p)) }));
      const pits = data.pitchers.map((p) => ({ p, w: weight(E.pitcherOverall(p)) }));
      const bScore = (x) => x.w;
      const toBatter = (p, pos) => ({
        name: p.name, pos, bats: p.bats, contact: p.contact, power: p.power, eye: p.eye,
        speed: p.speed, arm: p.arm, field: p.field, risk: p.risk, loft: p.loft, mlb: p.id, natural: p.pos, alt: p.alt || []
      });
      const toPitcher = (p, role) => ({ name: p.name, role, throws: p.throws, velo: p.velo, control: p.control, movement: p.movement, stamina: p.stamina, mlb: p.id });
      const lineup = ["C", "1B", "2B", "3B", "SS", "LF", "CF", "RF", "DH"].map((pos) => {
        const x = draw(bats.filter((b) => b.p.pos === pos), bScore) || draw(bats, bScore);
        const at = bats.indexOf(x);
        if (at >= 0) bats.splice(at, 1);
        return toBatter(x.p, pos);
      });
      const bench = [];
      for (const pos of ["C", "SS", "CF", "1B", "LF"]) {
        const pool = bats.filter((b) => b.p.pos === pos);
        const x = draw(pool, bScore) || draw(bats, bScore);
        const at = bats.indexOf(x);
        if (at >= 0) bats.splice(at, 1);
        bench.push(toBatter(x.p, x.p.pos));
      }
      const value = (p) => p.contact + p.power + p.eye;
      lineup.sort((a, b) => value(b) - value(a));
      const sps = pits.filter((x) => x.p.role === "SP");
      const rps = pits.filter((x) => x.p.role !== "SP");
      const sp = draw(sps, bScore);
      const pitchers = [toPitcher(sp.p, "SP")];
      for (let i = 0; i < 4; i++) {
        const x = draw(rps, bScore);
        pitchers.push(toPitcher(x.p, "RP"));
      }
      return { name: team.name, style: team.style || "balanced", scale: 2, lineup, bench, pitchers };
    }
