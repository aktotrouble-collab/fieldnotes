    function refreshMyTeam() {
      const sel = document.getElementById("d-my");
      if (!sel) return;
      const cur = sel.value;
      const on = draft.teams.filter((t) => t.on);
      sel.innerHTML = `<option value="">None</option>` + on.map((t) => `<option value="${esc(t.name)}">${esc(t.name)}</option>`).join("");
      sel.value = on.some((t) => t.name === cur) ? cur : (draft.mySaved || "");
    }

    async function createFromDraft() {
      const d = draft;
      const err = document.getElementById("d-err");
      err.textContent = "";
      const on = d.teams.filter((t) => t.on);
      if (on.length < 2) { err.textContent = "Pick at least two teams."; return; }
      if (new Set(on.map((t) => t.name)).size !== on.length) { err.textContent = "Team names must be different."; return; }
      let settings;
      try { settings=readSettings(d.settings); } catch(error){err.textContent=error.message;return;}
      if(d.source==="mlb"&&!settings.franchise.fictionalMLB)settings.franchise.startYear=d.year;
      if(settings.franchise.aging)settings.startDate=`${settings.franchise.startYear}-03-26`;
      const importSchedule = document.getElementById("d-schedule-source").value === "mlb";
      if(settings.franchise.aging&&importSchedule&&Number(document.getElementById("d-schedule-year").value)!==settings.franchise.startYear){err.textContent="Use the selected starting year's schedule in an aging league.";return;}
      if(settings.franchise.aging&&on.some(t=>t.roster&&[...t.roster.lineup,...t.roster.bench,...t.roster.pitchers].some(p=>typeof p.mlb==="number"&&(p.customYear||t.roster.src?.year||t.roster.year)!==settings.franchise.startYear))){err.textContent="Saved real-player rosters must use the selected starting year. Choose matching rosters or fictional players.";return;}
      const createButton = document.getElementById("d-create");
      createButton.disabled = true;
      let imported = null;
      if (importSchedule) {
        const button = document.getElementById("d-create");
        button.disabled = true;
        err.textContent = "Downloading MLB schedule…";
        try {
          imported = await M.load(Number(document.getElementById("d-schedule-year").value), on);
          if (draft !== d) return;
        } catch (error) {
          err.textContent = `Couldn't import MLB schedule: ${error.message}. No league was created.`;
          button.disabled = false;
          return;
        }
      }
      const myName = document.getElementById("d-my").value;
      settings.myTeam = myName ? on.findIndex((t) => t.name === myName) : null;
      if (settings.myTeam === null && settings.control === "hands") settings.control = "all";
      settings.leagueNames = [...new Set(on.map((t) => t.league))];
      if ((on.length * settings.gamesPerTeam) % 2) err.textContent = "Odd team count with odd games: one club will play a game fewer. Continuing.\n";
      const make = () => {
        if (draft !== d) return;
        try {
          const seed = d.seed === "" ? undefined : Number(d.seed);
          const lg = L.createLeague({
            name: d.name || "My League", source: d.source, year: d.source === "mlb" ? d.year : null, seed, settings, schedule: imported && imported.schedule,
            teams: on.map((t) => ({ code: t.code, name: t.name.trim(), abbr: t.abbr.trim() || t.name.slice(0, 3).toUpperCase(), color: t.color, park: t.park, league: t.league.trim() || "A", division: t.division.trim() || "East", roster: t.roster ? C.applyRoster(t.roster, { ...window.MLB_SEASONS, [latestYear]:window.MLB_PLAYERS }, latestYear, true) : null }))
          }, d.source === "mlb"&&!settings.franchise.fictionalMLB ? seasonData(d.year) : null);
          if (imported) M.apply(lg, imported);
          league = lg;
          draft = null;
          view = { ...view, tab: "standings", schedDay: null, teamIdx: settings.myTeam != null ? settings.myTeam : 0 };
          saveNow();
          render();
        } catch (e) { err.textContent = String(e.message || e); createButton.disabled = false; }
      };
      const years = new Set([...(d.source === "mlb"&&!settings.franchise.fictionalMLB ? [d.year] : []), ...on.flatMap(t => t.roster ? [t.roster.src?.year, t.roster.year, ...[...t.roster.lineup, ...t.roster.bench, ...t.roster.pitchers].map(p => p.customYear)] : [])].filter(Boolean));
      if (!years.size) return make();
      err.textContent += "Loading player data…";
      let remaining = years.size, failed = false;
      for (const year of years) loadSeason(year, ok => {
        if (!ok) { failed = true; createButton.disabled = false; err.textContent = `Couldn't load ${year} player data.`; }
        if (--remaining === 0 && !failed) make();
      });
    }

    /* ------------------------------------------------------------ league */
    const TABS = [["standings", "Standings"], ["schedule", "Schedule"], ["allstar", "All-Star Festivities"], ["franchise","Franchise"],["il","Injured List"],["trades","Trades"],["awards","Awards"],["offseason","Offseason"],["stats", "Stats"], ["leaders", "Leaders"], ["playoffs", "Playoffs"], ["teams", "Teams"], ["history", "History"], ["settings", "Settings"]];
    const teamName = (i) => league.teams[i].name;
    const dot = (i) => `<span class="dot" style="background:${esc(league.teams[i].color)}"></span>`;
    const myIdx = () => league.settings.myTeam;

    function render() {
      if (!league) { renderList(); return; }
      const s = league.settings;
      const clock = league.clock;
      const total = league.schedule.length;
      const phaseText = league.phase === "regular" ? `Regular season · day ${Math.min(league.day + 1, total)} of ${total}` : league.phase === "playoffs" ? "Postseason" : "Season complete";
      const champ = league.champion != null ? `<div class="champ">🏆 ${esc(teamName(league.champion))} are the ${esc(s.seasonLabel)} champions</div>` : "";
      $app.innerHTML = `
        <div class="card">
          <div class="row" style="justify-content:space-between;align-items:center">
            <div><h2 style="margin:0">${esc(league.name)} <span class="mute">· ${esc(s.seasonLabel)}</span></h2>
              <div class="mute">${esc(L.dateOf(league, clock))} · ${phaseText}</div></div>
            <div class="row"><button id="back-list">All leagues</button></div>
          </div>
          ${champ}
          <div id="today"></div>
          <div class="row" id="sim-ctl" style="margin-top:10px">
            <button id="sim-day">Sim day</button><button id="sim-week">Sim week</button><button id="sim-month">Sim month</button>
            <label class="inline">to <input type="date" id="sim-date" value="${L.dateOf(league, clock)}"></label><button id="sim-to">Sim to date</button>
            <button id="sim-reg">Finish regular season</button><button id="sim-all">Sim to the end</button>
            <button id="sim-stop" class="hidden">Stop</button>
          </div>
          <div class="bar" style="margin-top:10px"><i id="prog"></i></div>
          <div class="note" id="sim-msg"></div>
        </div>
        <div class="tabs">${TABS.map(([k, t]) => `<button data-tab="${k}" class="${view.tab === k ? "on" : ""}">${t}</button>`).join("")}</div>
        <div id="tab"></div>`;
      document.getElementById("back-list").addEventListener("click", () => { saveNow(); league = null; renderList(); });
      document.getElementById("sim-day").addEventListener("click", () => run({ days: 1 }));
      document.getElementById("sim-week").addEventListener("click", () => run({ days: 7 }));
      document.getElementById("sim-month").addEventListener("click", () => run({ days: 30 }));
      document.getElementById("sim-to").addEventListener("click", () => run({ date: document.getElementById("sim-date").value }));
      document.getElementById("sim-reg").addEventListener("click", () => run({ until: (lg) => lg.phase !== "regular" }));
      document.getElementById("sim-all").addEventListener("click", () => run({ until: (lg) => lg.phase === "done" }));
      document.getElementById("sim-stop").addEventListener("click", () => { stopFlag = true; });
      $app.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => { view.tab = b.dataset.tab; render(); }));
      renderToday();
      renderTab();
      updateButtons();
    }

    function updateButtons() {
      const done = league.phase === "done";
      $app.querySelectorAll("#sim-ctl button").forEach((b) => { if (b.id !== "sim-stop") b.disabled = running || done; });
      const stop = document.getElementById("sim-stop");
      if (stop) stop.classList.toggle("hidden", !running);
    }

    /* ------------------------------------------------------- today panel */
    function heldRefs() {
      const hold = L.holdFor(league);
      return L.pendingGames(league).filter(hold);
    }

    function renderToday() {
      const el = document.getElementById("today");
      if (!el) return;
      const refs = L.pendingGames(league);
      const mode = league.settings.control;
      const hold = L.holdFor(league);
      if (league.phase === "done") { el.innerHTML = ""; return; }
      const label = (r) => `${dot(r.away)}${esc(teamName(r.away))} <span class="mute">at</span> ${dot(r.home)}${esc(teamName(r.home))}${refs.filter(g => g.away === r.away && g.home === r.home).length > 1 || r.number > 1 ? ` <span class="pill">Game ${r.number || 1}</span>` : ""}`;
      const rows = refs.filter((r) => mode === "all" || hold(r) || false);
      const events = A.pending(league);
      el.innerHTML = (rows.length ? `<h3>Today's games</h3>${rows.map((r) => `
        <div class="game-row"><div class="teams">${label(r)}${r.post ? `<span class="pill">Playoffs</span>` : ""}</div>
        ${mode !== "sim" ? `<button class="small primary" data-play="${r.id}">Play</button>` : ""}<button class="small" data-sim="${r.id}">Sim</button></div>`).join("")}` : "")
        + (events.length ? `<h3>All-Star break</h3>${events.map(ref=>`<div class="game-row"><div class="teams">${ref.event === "derby" ? "Home Run Derby" : "All-Star Game"}</div><button data-fest-view>Play / simulate event</button></div>`).join("")}` : "");
      el.querySelectorAll("[data-fest-view]").forEach(button=>button.addEventListener("click",()=>{ view.tab="allstar";render(); }));
      el.querySelectorAll("[data-play]").forEach((b) => b.addEventListener("click", () => playGame(b.dataset.play)));
      el.querySelectorAll("[data-sim]").forEach((b) => b.addEventListener("click", () => {
        const ref = L.pendingGames(league).find((r) => r.id === b.dataset.sim);
        if (!ref) return;
        L.simRef(league, ref);
        L.closeDayIfDone(league);
        saveNow();
        render();
      }));
    }

    function playGame(id) {
      const ref = L.pendingGames(league).find((r) => r.id === id);
      if (!ref) return;
      const cfg = L.gameConfig(league, ref);
      const names = [teamName(ref.away), teamName(ref.home)];
      localStorage.setItem(PENDING_KEY, JSON.stringify({
        leagueId: league.id, refId: id, config: cfg, label: `${names[0]} at ${names[1]}`,
        colors: [league.teams[ref.away].color, league.teams[ref.home].color], abbrs: [league.teams[ref.away].abbr, league.teams[ref.home].abbr],
        my: league.settings.myTeam === ref.away ? 0 : league.settings.myTeam === ref.home ? 1 : null
      }));
      saveNow();
      location.href = "game.html?league=1";
    }

    /* -------------------------------------------------------- simulation */
    function run(target) {
      if (running || league.phase === "done") return;
      running = true;
      stopFlag = false;
      const hold = L.holdFor(league);
      const startClock = league.clock;
      const msg = document.getElementById("sim-msg");
      msg.textContent = "";
      updateButtons();
      const totalDays = league.schedule.length;
      const finished = () => {
        if (league.phase === "done") return true;
        if (target.days != null) return league.clock - startClock >= target.days;
        if (target.date) return L.dateOf(league, league.clock) >= target.date;
        return target.until(league);
      };
      const tick = () => {
        const t0 = performance.now();
        let blocked = false;
        let failure = "";
        while (!finished() && !stopFlag && performance.now() - t0 < 120) {
          try {
            const res = L.simDay(league, hold);
            if (res.held.length) { blocked = true; break; }
          } catch (error) {
            failure = error.message;
            break;
          }
        }
        document.getElementById("prog").style.width = `${Math.min(100, (league.phase === "regular" ? league.day / totalDays : 1) * 100)}%`;
        msg.textContent = `${L.dateOf(league, league.clock)} · ${league.log.length} games played`;
        if (!finished() && !stopFlag && !blocked && !failure) { setTimeout(tick, 0); return; }
        running = false;
        if (blocked) msg.textContent = "Your game or All-Star event is ready. Play it or sim it above.";
        saveNow();
        render();
        const m = document.getElementById("sim-msg");
        if (m && blocked) m.textContent = "Your game or All-Star event is ready. Play it or sim it above.";
        if (m && failure) m.textContent = `Simulation paused: ${failure}`;
      };
      setTimeout(tick, 0);
    }

    /* -------------------------------------------------------------- tabs */
    function renderTab() {
      const el = document.getElementById("tab");
      ({ standings: tabStandings, schedule: tabSchedule, allstar:tabAllStar,franchise:tabFranchise,il:tabIL,trades:tabTrades,awards:tabAwards,offseason:tabOffseason, stats: tabStats, leaders: tabLeaders, playoffs: tabPlayoffs, teams: tabTeams, history: tabHistory, settings: tabSettings }[view.tab])(el);
    }

    function tabAllStar(el) {
      const calendar = A.calendar(league);
      const showDerby=league.settings.festivities?.derby!==false,showGame=league.settings.festivities?.game!==false;
      const pool = A.rankings(league);
      const festivalOptions = (kind,selected) => pool[kind].map(entry=>`<option value="${esc(entry.key)}"${entry.key === selected ? " selected" : ""}>${esc(entry.player.name)} · ${esc(teamName(entry.team))}</option>`).join("");
      if (!calendar.length) {
        el.innerHTML = `<div class="card"><h2>All-Star Festivities</h2><p class="note">No festivities are scheduled. At league creation, choose a midseason break for any schedule, or use an imported MLB All-Star break.</p></div>`;
        return;
      }
      el.innerHTML = calendar.map(date=>{
        const event = league.allStar?.[date.index];
        const available = A.pending(league).filter(ref=>ref.index === date.index);
        const dateText = L.dateOf(league,date.day);
        if (!event && league.day > date.day) return `<div class="card"><h2>All-Star break · ${esc(dateText)}</h2><p class="note">This league already passed the break before festivities were enabled. Events will be available next season; no games have been backdated.</p></div>`;
        if (!event && league.day < date.derbyDay) return `<div class="card"><h2>All-Star break · ${esc(dateText)}</h2><p>${showDerby?`Home Run Derby: ${esc(L.dateOf(league,date.derbyDay))}`:""}${showGame?` · All-Star Game: ${esc(dateText)}`:""}</p><p class="note">Participants will be selected at the break using your league's season performance. Ratings break ties or fill missing statistics. ${date.inferred ? "Break dates inferred from this legacy imported calendar." : ""}</p></div>`;
        const current = event || A.ensure(league,date.index);
        const derby = current.derby;
        const participant = i=>esc(derby.entrants[i].player.name);
        const bracket = derby.matches.map(m=>`<tr><td class="l">${["Quarterfinal","Semifinal","Final"][m.round]}</td><td class="l">${participant(m.a)} vs ${participant(m.b)}</td><td>${A.totals(m.turns[0]).hr}–${A.totals(m.turns[1]).hr}</td><td class="l">${m.winner === null ? "Pending" : participant(m.winner)}</td></tr>`).join("");
        return `<div class="card"><h2>All-Star Festivities · ${esc(dateText)}</h2><p>${esc(current.venue)} · field: ${esc(GE.parkById(current.park).name)}</p>
          <p class="note">Automatic selections use league performance at the break. Override participants below before playing. Events do not affect regular-season standings, stats, rotation or fatigue. Derby: eight seeds by season HR, then power; 10 swings each per matchup. Ties use up to three extra swings each, then longest homer. If still tied, alternating one-swing rounds continue until one hitter hits a longer homer in the same round. Both hitters always get a swing; no seed-based winner.</p>
          <section${showDerby?"":" hidden"}><h3>Home Run Derby · ${esc(L.dateOf(league,date.derbyDay))}</h3>
          ${derby.champion !== null ? `<p class="champ">${participant(derby.champion)} wins the Home Run Derby!</p>` : ""}
          <div class="scroll"><table><tr><th class="l">Seed</th><th class="l">Entrant</th><th class="l">Club</th><th>Season HR</th></tr>${derby.entrants.map((p,i)=>`<tr><td class="l">${i+1}</td><td class="l">${esc(p.player.name)}</td><td class="l">${esc(teamName(p.team))}</td><td>${p.stats.hr || 0}</td></tr>`).join("")}</table></div>
          ${!derby.matches.some(m=>m.turns.some(t=>t.length)) ? `<details data-derby-edit="${date.index}"><summary>Override Derby entrants / seeds</summary><p class="note">Choose any eight different league hitters. Seed order sets the bracket. Locked after the first swing.</p>${derby.entrants.map((p,i)=>`<label>Seed ${i+1}<select data-derby-pick="${i}" aria-label="Derby seed ${i+1}">${festivalOptions("bat",p.key)}</select></label>`).join("")}<button data-save-derby="${date.index}">Save Derby selections</button></details>` : ""}
          <div class="scroll"><table style="margin-top:10px"><tr><th class="l">Round</th><th class="l">Matchup</th><th>HR</th><th class="l">Winner</th></tr>${bracket}</table></div>
          </section><section${showGame?"":" hidden"}><h3>All-Star Game · ${esc(dateText)}</h3>
          ${current.gameConfig ? `<p class="note">Custom game setup: ${esc(GE.parkById(current.gameConfig.park).name)} · ${esc(current.gameConfig.weather.date)} · ${current.gameConfig.innings} innings.</p>` : ""}
          ${current.game ? `<p class="champ">${esc(current.teams[0].name)} ${current.game.score[0]} – ${current.game.score[1]} ${esc(current.teams[1].name)}</p>` : `<p>${esc(current.teams[0].name)} at ${esc(current.teams[1].name)} · ${current.gameConfig?.innings || 9} innings · Full Exhibition-style setup available when playing.</p>`}
          <div class="grid2">${current.teams.map(t=>`<div><h3>${esc(t.name)}</h3><p>${t.lineup.map(p=>`${esc(p.name)} (${esc(p.pos)})`).join(" · ")}</p><p class="note">Bench: ${t.bench.map(p=>esc(p.name)).join(", ")}<br>Pitchers: ${t.pitchers.map(p=>esc(p.name)).join(", ")}</p></div>`).join("")}</div>
          ${!current.game ? `<details data-allstar-edit="${date.index}"><summary>Override All-Star rosters</summary><p class="note">Any league hitter or pitcher can join either side. Each player may appear only once. Starting slots set positions; batting order and player details can also be edited in game setup. Choose “None” to remove a bench player or reliever.</p><div class="grid2">${current.teams.map((t,side)=>`<div data-allstar-side="${side}"><h3>${esc(t.name)}</h3>${["lineup","bench","pitchers"].map(kind=>t[kind].map((p,i)=>`<label>${kind === "lineup" ? [...GE.POSITIONS,"DH"][i] : kind === "bench" ? "Bench "+(i+1) : i === 0 ? "Starting pitcher" : "Reliever "+i}<select data-as-kind="${kind}" aria-label="${side === 0 ? "Away" : "Home"} ${kind} ${i+1}">${kind !== "lineup" && !(kind === "pitchers" && i === 0) ? '<option value="">None</option>' : ""}${festivalOptions(kind === "pitchers" ? "pit" : "bat",L.pkey(null,p))}</select></label>`).join("")).join("")}</div>`).join("")}</div><button data-save-allstar="${date.index}">Save All-Star selections</button></details>` : ""}
          </section>${available.map(ref=>`<div class="row"><b>${ref.event === "derby" ? "Home Run Derby" : "All-Star Game"}</b><button class="primary" data-fest-play="${ref.id}">Play event</button><button data-fest-sim="${ref.id}">Simulate event</button></div>`).join("")}
          ${showGame&&!current.game && league.day < date.day && (derby.champion !== null||!showDerby) ? `<p class="note">Advance to ${esc(dateText)} for the All-Star Game.</p>` : ""}
          <div class="err" id="fest-error-${date.index}" role="status"></div></div>`;
      }).join("");
      el.querySelectorAll("[data-fest-sim]").forEach(button=>button.addEventListener("click",()=>festival(button.dataset.festSim,false)));
      el.querySelectorAll("[data-fest-play]").forEach(button=>button.addEventListener("click",()=>festival(button.dataset.festPlay,true)));
      el.querySelectorAll("[data-save-derby], [data-save-allstar]").forEach(button=>button.addEventListener("click",()=>{
        const derby = button.hasAttribute("data-save-derby");
        const index = Number(derby ? button.dataset.saveDerby : button.dataset.saveAllstar);
        try {
          const editor = button.closest("details");
          if (derby) A.overrideDerby(league,index,[...editor.querySelectorAll("[data-derby-pick]")].map(select=>select.value));
          else A.overrideTeams(league,index,[...editor.querySelectorAll("[data-allstar-side]")].map(side=>Object.fromEntries(["lineup","bench","pitchers"].map(kind=>[kind,[...side.querySelectorAll(`[data-as-kind="${kind}"]`)].map(select=>select.value).filter(Boolean)]))));
          const pending = JSON.parse(localStorage.getItem(PENDING_KEY));
          if (pending?.leagueId === league.id && pending.index === index && pending.event === (derby ? "derby" : "allstar")) localStorage.removeItem(PENDING_KEY);
          if (!saveNow()) throw new Error("Couldn't save participant overrides.");
          render();
        } catch (error) { document.getElementById(`fest-error-${index}`).textContent=error.message; }
      }));
    }

    function festival(id, play) {
      const ref = A.pending(league).find(r=>r.id === id);
      if (!ref || running) return;
      try {
        const event = A.ensure(league,ref.index);
        if (!play) {
          A.simulate(league,ref,L.extract);
          if (!saveNow()) throw new Error("Couldn't save All-Star results.");
          L.closeDayIfDone(league);
          saveNow();
          render();
          return;
        }
        const cfg = A.config(league,ref);
        const pending = {
          leagueId:league.id,refId:ref.id,event:ref.event,index:ref.index,config:cfg,
          label:ref.event === "derby" ? "Home Run Derby" : `${cfg.away.name} at ${cfg.home.name}`,
          colors:["#2b6fa6","#d27637"],abbrs:[cfg.away.group,cfg.home.group],my:0,
          allStarEvent:event
        };
        if (!saveNow()) throw new Error("Couldn't save All-Star selections.");
        localStorage.setItem(PENDING_KEY,JSON.stringify(pending));
        location.href="game.html?league=1";
      } catch (error) {
        saveNow();
        const status = document.getElementById(`fest-error-${ref.index}`);
        if (status) status.textContent = error.message;
        else alert(error.message);
      }
    }

    function tabStandings(el) {
      const groups = L.standings(league);
      const showDiv = groups.some((g) => g.divisions.length > 1);
      const cols = `<th class="l">Team</th><th>W</th><th>L</th><th>PCT</th><th>GB</th><th>RS</th><th>RA</th><th>DIFF</th><th>Home</th><th>Away</th><th>Div</th><th>L10</th><th>STRK</th>`;
      const rowHtml = (t) => {
        const r = league.rec[t.idx];
        const l10 = r.last.reduce((a, b) => a + b, 0);
        return `<tr class="${t.idx === myIdx() ? "mine" : ""}"><td class="l">${dot(t.idx)}${esc(teamName(t.idx))}</td><td>${r.w}</td><td>${r.l}</td><td>${pct(r.w, r.l)}</td><td>${t.gb ? t.gb.toFixed(1) : "-"}</td>
          <td>${r.rs}</td><td>${r.ra}</td><td>${r.rs - r.ra > 0 ? "+" : ""}${r.rs - r.ra}</td><td>${r.hw}-${r.hl}</td><td>${r.aw}-${r.al}</td><td>${r.dw}-${r.dl}</td><td>${l10}-${r.last.length - l10}</td><td>${r.streak > 0 ? "W" + r.streak : r.streak < 0 ? "L" + -r.streak : "-"}</td></tr>`;
      };
      el.innerHTML = `<div class="grid2">${groups.map((g) => `<div class="card"><h2>${esc(g.name)}</h2><div class="scroll">${showDiv ? g.divisions.map((d) => `
        <table><thead><tr>${cols.replace("Team", esc(d.name))}</tr></thead><tbody>${d.teams.map(rowHtml).join("")}</tbody></table>`).join('<div style="height:10px"></div>') : ""}</div></div>`).join("")}</div>`;
      if (league.phase !== "regular") return;
    }

    function dayRowHtml(day, k, away, home) {
      const id = `${league.seasonNo}.${day}.${k}`;
      const r = logMap()[id];
      if (r) {
        const aw = r.sa > r.sh;
        return `<div class="game-row"><div class="teams"><span style="${aw ? "font-weight:700" : ""}">${dot(away)}${esc(teamName(away))} ${r.sa}</span> &nbsp; <span style="${aw ? "" : "font-weight:700"}">${dot(home)}${esc(teamName(home))} ${r.sh}</span>${r.inn > league.settings.innings ? `<span class="pill">F/${r.inn}</span>` : ""}
          <div class="detail">${r.w ? `W: ${esc(r.w)}` : ""}${r.l ? ` · L: ${esc(r.l)}` : ""}${r.sv ? ` · SV: ${esc(r.sv)}` : ""}${r.hr.length ? ` · HR: ${esc(r.hr.join(", "))}` : ""} · H ${r.ha}-${r.hh} · E ${r.ea}-${r.eh}</div></div></div>`;
      }
      const game = league.scheduleImport?.gameInfo[day]?.[k];
      const doubleheader = league.schedule[day].filter(([a,h]) => a === away && h === home).length > 1;
      return `<div class="game-row"><div class="teams">${dot(away)}${esc(teamName(away))} <span class="mute">at</span> ${dot(home)}${doubleheader ? ` <span class="pill">Game ${game?.number || 1}</span>` : ""}</div></div>`;
    }

    let logCache = null;
    function logMap() {
      if (!logCache || logCache.n !== league.log.length || logCache.id !== league.id) {
        const m = {};
        for (const r of league.log) m[r.id] = r;
        logCache = { n: league.log.length, id: league.id, m };
      }
      return logCache.m;
    }

    function tabSchedule(el) {
      const team = view.schedTeam;
      const opts = [["all", "All teams (by day)"], ...league.teams.map((t, i) => [i, t.name])];
      let body = "";
      if (team === "all") {
        const day = view.schedDay == null ? Math.min(league.day, league.schedule.length - 1) : view.schedDay;
        const games = league.schedule[day] || [];
        body = `<div class="row" style="align-items:center"><button class="small" id="d-prev">&larr;</button><b>${esc(L.dateOf(league, day))}</b> <span class="mute">day ${day + 1} of ${league.schedule.length}</span><button class="small" id="d-next">&rarr;</button><button class="small" id="d-today">Current day</button></div>
          ${A.calendar(league).filter(date=>date.derbyDay === day || date.day === day).map(date=>`<p><strong>${[league.settings.festivities?.derby!==false&&date.derbyDay===day?"Home Run Derby":"",league.settings.festivities?.game!==false&&date.day===day?"All-Star Game":""].filter(Boolean).join(" / ")}</strong> · See All-Star Festivities to play or simulate.</p>`).join("")}
          ${games.map(([a, h], k) => dayRowHtml(day, k, a, h)).join("") || `<p class="mute">No regular-season games.</p>`}`;
      } else {
        const t = Number(team);
        const rows = [];
        league.schedule.forEach((games, d) => games.forEach(([a, h], k) => { if (a === t || h === t) rows.push({ d, k, a, h }); }));
        const m = logMap();
        body = `<div class="scroll"><table><thead><tr><th class="l">Date</th><th class="l">Opponent</th><th>Result</th><th class="l">Pitchers</th></tr></thead><tbody>${rows.map((x) => {
          const r = m[`${league.seasonNo}.${x.d}.${x.k}`];
          const home = x.h === t;
          const opp = home ? x.a : x.h;
          let res = "";
          let pit = "";
          if (r) {
            const mine = home ? r.sh : r.sa;
            const theirs = home ? r.sa : r.sh;
            res = `${mine > theirs ? "W" : "L"} ${mine}-${theirs}`;
            pit = `${r.w ? "W: " + r.w : ""} ${r.l ? "L: " + r.l : ""}`;
          }
          return `<tr><td class="l">${esc(L.dateOf(league, x.d))}</td><td class="l">${home ? "vs" : "@"} ${dot(opp)}${esc(teamName(opp))}</td><td>${res}</td><td class="l mute">${esc(pit)}</td></tr>`;
        }).join("")}</tbody></table></div>`;
      }
      el.innerHTML = `<div class="card"><div class="row"><label>View<select id="sch-team">${opt(opts, team)}</select></label></div>
        ${league.scheduleImport ? `<p class="note">Imported ${league.scheduleImport.year} MLB regular season: ${league.scheduleImport.totalGames} games, ${esc(league.scheduleImport.startDate)} through ${esc(league.scheduleImport.endDate)}. Source: MLB Stats API. Roster season: ${league.year || "custom"}. Special-site games use your league's ballpark setting.</p>` : ""}
        <details style="margin-top:12px"><summary>Import an MLB season schedule</summary>
          <p class="note">All 30 MLB clubs are required. Available only before any games are played or days advanced. Replaces the current calendar, including start date, off-days, doubleheaders and home/away assignments. Scheduled All-Star Games include a Home Run Derby the previous day, playable or simulated with league-performance selections. Completed makeups replace postponed/cancelled placeholders. Requires internet.</p>
          <div class="row"><label>Schedule year<input id="sch-import-year" type="number" min="1901" max="${new Date().getFullYear()+1}" value="${league.scheduleImport?.year || league.year || latestYear}"></label>
          <button id="sch-import"${running || league.log.length || league.clock || league.day || league.phase !== "regular" ? " disabled" : ""}>Import MLB schedule</button></div>
          <div id="sch-import-status" class="err" role="status"></div>
        </details><div style="margin-top:10px">${body}</div></div>`;
      document.getElementById("sch-import").addEventListener("click", async () => {
        const target = league;
        const button = document.getElementById("sch-import");
        const status = document.getElementById("sch-import-status");
        try {
          M.teamMap(target.teams);
          if (!await window.BrowserDialog.confirm("Replace this unplayed league's schedule with the selected MLB season calendar? Rosters will not change.")) return;
          button.disabled = true;
          status.textContent = "Downloading MLB schedule…";
          const imported = await M.load(Number(document.getElementById("sch-import-year").value), target.teams);
          if (league !== target || running) throw new Error("The league changed or simulation started while downloading. Try again before playing any games.");
          M.apply(target, imported);
          view.schedDay = null;
          if (!saveNow()) throw new Error("Could not save the imported schedule to browser storage.");
          render();
        } catch (error) {
          status.textContent = `Couldn't import schedule: ${error.message}`;
          button.disabled = false;
        }
      });
      document.getElementById("sch-team").addEventListener("change", (e) => { view.schedTeam = e.target.value; renderTab(); });
      const prev = document.getElementById("d-prev");
      if (prev) {
        const cur = () => (view.schedDay == null ? Math.min(league.day, league.schedule.length - 1) : view.schedDay);
        prev.addEventListener("click", () => { view.schedDay = Math.max(0, cur() - 1); renderTab(); });
        document.getElementById("d-next").addEventListener("click", () => { view.schedDay = Math.min(league.schedule.length - 1, cur() + 1); renderTab(); });
        document.getElementById("d-today").addEventListener("click", () => { view.schedDay = null; renderTab(); });
      }
    }

    const BAT_COLS = [["name", "Player", "l"], ["team", "Tm", "l"], ["g", "G"], ["pa", "PA"], ["ab", "AB"], ["r", "R"], ["h", "H"], ["d", "2B"], ["t", "3B"], ["hr", "HR"], ["rbi", "RBI"], ["bb", "BB"], ["k", "K"], ["sb", "SB"], ["cs", "CS"], ["avg", "AVG", "", f3], ["obp", "OBP", "", f3], ["slg", "SLG", "", f3], ["ops", "OPS", "", f3]];
    const PIT_COLS = [["name", "Player", "l"], ["team", "Tm", "l"], ["g", "G"], ["gs", "GS"], ["w", "W"], ["l", "L"], ["sv", "SV"], ["ip", "IP", "", null, "outs"], ["h", "H"], ["r", "R"], ["bb", "BB"], ["k", "K"], ["hr", "HR"], ["ra9", "RA/9", "", f2], ["whip", "WHIP", "", f2], ["k9", "K/9", "", f2], ["bb9", "BB/9", "", f2]];
    const LOW = { ra9: 1, whip: 1, bb9: 1, name: 1, team: 1 };

    function tabStats(el) {
      const kind = view.statKind;
      const phase = view.statPhase;
      let rows;
      let cols;
      if (kind === "team") {
        const tt = L.teamTotals(league, phase);
        rows = league.teams.map((t, i) => ({ name: t.name, team: t.abbr, idx: i, w: league.rec[i].w, l: league.rec[i].l, rs: league.rec[i].rs, ra: league.rec[i].ra, ...(tt[i].bat ? { avg: tt[i].bat.avg, obp: tt[i].bat.obp, slg: tt[i].bat.slg, hr: tt[i].bat.hr, sb: tt[i].bat.sb, bk: tt[i].bat.k } : {}), ...(tt[i].pit ? { ra9: tt[i].pit.ra9, whip: tt[i].pit.whip, pk: tt[i].pit.k, pbb: tt[i].pit.bb, phr: tt[i].pit.hr } : {}) }));
        cols = [["name", "Team", "l"], ["w", "W"], ["l", "L"], ["rs", "RS"], ["ra", "RA"], ["avg", "AVG", "", f3], ["obp", "OBP", "", f3], ["slg", "SLG", "", f3], ["hr", "HR"], ["sb", "SB"], ["bk", "K (bat)"], ["ra9", "RA/9", "", f2], ["whip", "WHIP", "", f2], ["pk", "K (pit)"], ["pbb", "BB (pit)"], ["phr", "HR (pit)"]];
      } else {
        rows = L.statRows(league, phase, kind,view.statTeam==="all"?undefined:Number(view.statTeam)).map((r) => ({ ...r, tm: r.team, team: league.teams[r.team].abbr }));
        if (!view.statAll && phase === "reg" && league.log.length) {
          const games = (r) => league.rec[r.tm].w + league.rec[r.tm].l;
          rows = rows.filter((r) => (kind === "bat" ? r.pa >= 1 : r.outs >= 1));
          if (view.qualified) rows = rows.filter((r) => (kind === "bat" ? r.pa >= 3.1 * games(r) : r.outs >= 3 * games(r)));
        }
        cols = kind === "bat" ? BAT_COLS : PIT_COLS;
      }
      const sort = view.statSort && cols.some((c) => c[0] === view.statSort.k) ? view.statSort : { k: kind === "bat" ? "ops" : kind === "pit" ? "outs" : "w", dir: -1 };
      const key = sort.k === "ip" ? "outs" : sort.k;
      rows.sort((a, b) => {
        const av = a[key];
        const bv = b[key];
        const c = typeof av === "string" ? String(av).localeCompare(bv) : (av || 0) - (bv || 0);
        return c * sort.dir || String(a.name).localeCompare(b.name);
      });
      const limit = kind === "team" ? rows.length : 60;
      el.innerHTML = `<div class="card"><div class="row">
        <label>Table<select id="st-kind">${opt([["bat", "Batting"], ["pit", "Pitching"], ["team", "Teams"]], kind)}</select></label>
        <label>Games<select id="st-phase">${opt([["reg", "Regular season"], ["post", "Postseason"]], phase)}</select></label>
        ${kind !== "team" ? `<label>Team<select id="st-team">${opt([["all", "All teams"], ...league.teams.map((t, i) => [i, t.name])], view.statTeam)}</select></label>
        <label class="inline"><input id="st-q" type="checkbox"${view.qualified ? " checked" : ""}> Qualified only</label>
        <label class="inline"><input id="st-all" type="checkbox"${view.statAll ? " checked" : ""}> Show all rows</label>` : ""}</div>
        <div class="scroll" style="margin-top:10px"><table><thead><tr>${cols.map((c) => `<th class="sort ${c[2] || ""}" data-k="${c[0]}">${c[1]}${sort.k === c[0] ? (sort.dir < 0 ? " ▼" : " ▲") : ""}</th>`).join("")}</tr></thead>
        <tbody>${rows.slice(0, view.statAll ? rows.length : limit).map((r) => `<tr class="${r.tm === myIdx() || r.idx === myIdx() ? "mine" : ""}">${cols.map((c) => {
          const v = r[c[0]];
          const out = c[0] === "ip" ? r.ip : c[3] ? (v == null ? "-" : c[3](v)) : (v == null ? (c[0] === "name" ? "" : "-") : esc(v));
          return `<td class="${c[2] || ""}">${out === undefined ? "" : out}</td>`;
        }).join("")}</tr>`).join("") || `<tr><td colspan="${cols.length}" class="l mute">No stats yet. Sim some games.</td></tr>`}</tbody></table></div>
        ${rows.length > limit && !view.statAll ? `<div class="note">Showing the top ${limit} of ${rows.length}. Tick "Show all rows" for the rest.</div>` : ""}
        ${kind === "pit" ? `<div class="note">RA/9 counts all runs: the engine doesn't track earned runs. W/L/SV are approximated from the box score.</div>` : ""}</div>`;
      const g = (id) => document.getElementById(id);
      g("st-kind").addEventListener("change", (e) => { view.statKind = e.target.value; view.statSort = null; renderTab(); });
      g("st-phase").addEventListener("change", (e) => { view.statPhase = e.target.value; renderTab(); });
      if (g("st-team")) {
        g("st-team").addEventListener("change", (e) => { view.statTeam = e.target.value; renderTab(); });
        g("st-q").addEventListener("change", (e) => { view.qualified = e.target.checked; renderTab(); });
        g("st-all").addEventListener("change", (e) => { view.statAll = e.target.checked; renderTab(); });
      }
      el.querySelectorAll("th.sort").forEach((th) => th.addEventListener("click", () => {
        const k = th.dataset.k;
        view.statSort = { k, dir: view.statSort && view.statSort.k === k ? -view.statSort.dir : (LOW[k] ? 1 : -1) };
        renderTab();
      }));
    }

    function tabLeaders(el) {
      const cats = [
        ["bat", "hr", "Home runs", (v) => v], ["bat", "rbi", "RBI", (v) => v], ["bat", "avg", "Batting average", f3], ["bat", "ops", "OPS", f3],
        ["bat", "h", "Hits", (v) => v], ["bat", "sb", "Stolen bases", (v) => v], ["bat", "r", "Runs", (v) => v], ["bat", "bb", "Walks", (v) => v],
        ["pit", "w", "Wins", (v) => v], ["pit", "k", "Strikeouts", (v) => v], ["pit", "ra9", "RA/9", f2], ["pit", "whip", "WHIP", f2],
        ["pit", "sv", "Saves", (v) => v], ["pit", "k9", "K/9", f2]
      ];
      const phase = view.statPhase;
      el.innerHTML = `<div class="card"><div class="row"><label>Games<select id="ld-phase">${opt([["reg", "Regular season"], ["post", "Postseason"]], phase)}</select></label></div></div>
        <div class="grid3">${cats.map(([kind, stat, title, fmt]) => `<div class="card"><h2>${title}</h2><table>${L.leaders(league, phase, kind, stat, 10).map((r, i) => `<tr><td class="l">${i + 1}. ${esc(r.name)} <span class="mute">${esc(r.team)}</span></td><td><b>${fmt(r.v)}</b></td></tr>`).join("") || `<tr><td class="mute l">No data yet</td></tr>`}</table></div>`).join("")}</div>`;
      document.getElementById("ld-phase").addEventListener("change", (e) => { view.statPhase = e.target.value; renderTab(); });
    }

    function tabPlayoffs(el) {
      const po = league.po;
      if (!po) {
        el.innerHTML = `<div class="card"><h2>Playoff picture</h2>${league.settings.playoffs.enabled ? `<p class="mute">If the season ended today:</p>` : `<p class="mute">The postseason is turned off. The best record wins the title.</p>`}
          ${league.settings.playoffs.enabled ? Object.entries(L.playoffSeeds(league)).map(([lg, ids]) => `<h3>${esc(lg)}</h3><ol>${ids.map((i) => `<li>${dot(i)}${esc(teamName(i))} <span class="mute">${league.rec[i].w}-${league.rec[i].l}</span></li>`).join("")}</ol>`).join("") : ""}</div>`;
        return;
      }
      const seedOf = (i, s) => `${dot(i)}${esc(teamName(i))}`;
      el.innerHTML = `<div class="card"><h2>Bracket</h2>${league.champion != null ? `<div class="champ">🏆 ${esc(teamName(league.champion))}</div>${po.finalText ? `<div class="mute">${esc(po.finalText)}</div>` : ""}` : ""}
        <div class="grid3">${po.rounds.map((r, i) => `<div><h3>${r.final && Object.keys(po.slots).length > 1 ? "Championship" : `Round ${i + 1}`}</h3>${r.series.map((s) => `<div class="series ${s.winner != null ? "done" : ""}">
          <div class="mute" style="font-size:11px">${esc(s.league)} · best of ${s.len}</div>
          <div style="${s.winner === s.hi ? "font-weight:700" : ""}">${s.hiSeed < 99 && s.league !== "Final" ? `(${s.hiSeed}) ` : ""}${seedOf(s.hi)} <span style="float:right">${s.w[0]}</span></div>
          <div style="${s.winner === s.lo ? "font-weight:700" : ""}">${s.league !== "Final" ? `(${s.loSeed}) ` : ""}${seedOf(s.lo)} <span style="float:right">${s.w[1]}</span></div></div>`).join("")}</div>`).join("")}</div></div>`;
    }

    function tabTeams(el) {
      const ti = Math.min(view.teamIdx, league.teams.length - 1);
      const t = league.teams[ti];
      const bat = league.stats.reg.bat;
      const pit = league.stats.reg.pit;
      const heightPlayers = [...t.roster.lineup, ...t.roster.bench, ...t.roster.rotation, ...t.roster.bullpen];
      const heightCell = (p) => `<td><input type="number" step="any" data-player-height="${heightPlayers.indexOf(p)}" value="${GE.playerHeight(p)}" aria-label="${esc(p.name)} height in inches" title="Height in inches. 72 = 6 ft; affects figure height and catch reach."></td>`;
      const weightCell = (p) => `<td><input type="number" step="any" data-player-weight="${heightPlayers.indexOf(p)}" value="${GE.playerWeight(p)}" aria-label="${esc(p.name)} weight in pounds" title="Weight in pounds. Adjusts icon width relative to height; visual only. No upper cap."></td>`;
      const brow = (p) => {
        const r = bat[L.pkey(t, p)];
        const d = r ? L.derivedBat(r) : null;
        return `<tr><td class="l">${esc(p.name)}</td><td>${esc(p.pos)}</td><td>${esc(p.bats || "")}</td>${heightCell(p)}${weightCell(p)}<td>${p.contact}</td><td>${p.power}</td><td>${p.eye}</td><td>${p.speed}</td><td>${p.arm}</td><td>${p.field}</td><td>${d ? d.g : 0}</td><td>${d ? f3(d.avg) : "-"}</td><td>${d ? d.hr : 0}</td><td>${d ? d.rbi : 0}</td><td>${d ? f3(d.ops) : "-"}</td></tr>`;
      };
      const prow = (p) => {
        const r = pit[L.pkey(t, p)];
        const d = r ? L.derivedPit(r) : null;
        return `<tr><td class="l">${esc(p.name)}</td><td>${esc(p.role)}</td><td>${esc(p.throws || "")}</td>${heightCell(p)}${weightCell(p)}<td>${p.velo}</td><td>${p.control}</td><td>${p.movement}</td><td>${p.stamina}</td><td>${d ? d.g : 0}</td><td>${d ? `${d.w}-${d.l}` : "-"}</td><td>${d ? d.sv : 0}</td><td>${d ? d.ip : "0.0"}</td><td>${d ? f2(d.ra9) : "-"}</td><td>${d ? d.k : 0}</td></tr>`;
      };
      const ro = t.roster;
      el.innerHTML = `<div class="card"><div class="row"><label>Team<select id="tm-sel">${opt(league.teams.map((x, i) => [i, x.name]), ti)}</select></label>
        <label>Name<input id="tm-name" type="text" value="${esc(t.name)}"></label><label>Abbr<input id="tm-abbr" type="text" value="${esc(t.abbr)}" style="width:60px"></label>
        <label>Color<input id="tm-color" type="color" value="${esc(t.color)}"></label><label>Home park<select id="tm-park">${parkOpts(t.park)}</select></label>
        <button id="tm-save">Save</button><button id="tm-my">${myIdx() === ti ? "This is my team" : "Make this my team"}</button></div>
        <p class="note">${esc(t.league)} · ${esc(t.division)} · record ${league.rec[ti].w}-${league.rec[ti].l}</p></div>
        <div class="card"><h2>Lineup</h2><p class="note">Height is editable in total inches (72 = 6 ft); weight is in pounds. Weight subtly changes icon width relative to height, not speed or catch reach. Changes are saved with this league and override automatic MLB updates.</p><div class="scroll"><table><thead><tr><th class="l">Player</th><th>Pos</th><th>B</th><th>Height (in)</th><th>Weight (lb)</th><th>CON</th><th>PWR</th><th>EYE</th><th>SPD</th><th>ARM</th><th>FLD</th><th>G</th><th>AVG</th><th>HR</th><th>RBI</th><th>OPS</th></tr></thead>
          <tbody>${ro.lineup.map(brow).join("")}<tr><td class="l mute" colspan="16">Bench</td></tr>${ro.bench.map(brow).join("")}</tbody></table></div></div>
        <div class="card"><h2>Pitching staff</h2><div class="scroll"><table><thead><tr><th class="l">Pitcher</th><th>Role</th><th>T</th><th>Height (in)</th><th>Weight (lb)</th><th>VEL</th><th>CTL</th><th>MOV</th><th>STA</th><th>G</th><th>W-L</th><th>SV</th><th>IP</th><th>RA/9</th><th>K</th></tr></thead>
          <tbody>${ro.rotation.concat(ro.bullpen).map(prow).join("")}</tbody></table></div></div>`;
      const g = (id) => document.getElementById(id);
      el.querySelectorAll("[data-player-height]").forEach((input) => input.addEventListener("change", () => {
        const height = Number(input.value);
        if (!Number.isFinite(height) || height <= 0) {
          input.setCustomValidity("Enter a height greater than zero inches.");
          input.reportValidity();
          return;
        }
        input.setCustomValidity("");
        const player = heightPlayers[Number(input.dataset.playerHeight)];
        player.height = height;
        player.heightManual = true;
        saveNow();
      }));
      el.querySelectorAll("[data-player-weight]").forEach((input) => input.addEventListener("change", () => {
        const weight = Number(input.value);
        if (!Number.isFinite(weight) || weight <= 0) {
          input.setCustomValidity("Enter a weight greater than zero pounds.");
          input.reportValidity();
          return;
        }
        input.setCustomValidity("");
        const player = heightPlayers[Number(input.dataset.playerWeight)];
        player.weight = weight;
        player.weightManual = true;
        saveNow();
      }));
      g("tm-sel").addEventListener("change", (e) => { view.teamIdx = Number(e.target.value); renderTab(); });
      g("tm-save").addEventListener("click", () => {
        t.name = g("tm-name").value.trim() || t.name;
        t.abbr = g("tm-abbr").value.trim() || t.abbr;
        t.color = g("tm-color").value;
        t.park = g("tm-park").value;
        saveNow();
        render();
      });
      g("tm-my").addEventListener("click", () => { league.settings.myTeam = ti; if (league.settings.control === "sim") league.settings.control = "hands"; saveNow(); render(); });
    }

    const franchisePanel=(tab,el)=>window.FranchiseUI.render(tab,league,el,view,saveNow,render);
    const tabFranchise=el=>franchisePanel("franchise",el);
    const tabIL=el=>franchisePanel("il",el);
    const tabTrades=el=>franchisePanel("trades",el);
    const tabAwards=el=>franchisePanel("awards",el);
    const tabOffseason=el=>franchisePanel("offseason",el);
    function tabHistory(el) {
      const done = league.phase === "done";
      el.innerHTML = `<div class="card"><h2>Past seasons</h2>${league.history.length ? `<table><thead><tr><th class="l">Season</th><th class="l">Champion</th><th class="l">Final</th></tr></thead><tbody>${league.history.map((h) => `<tr><td class="l">${esc(h.label)}</td><td class="l">${esc(h.champion || "-")}</td><td class="l mute">${esc(h.final || "")}</td></tr>`).join("")}</tbody></table>` : `<p class="mute">Nothing yet. Finish the season to start your history.</p>`}</div>
        ${league.history.length ? `<div class="grid3">${league.history.slice().reverse().map((h) => `<div class="card"><h2>${esc(h.label)}</h2>${Object.entries({ hr: "HR", avg: "AVG", rbi: "RBI", w: "Wins", k: "K", ra9: "RA/9" }).map(([k, t]) => `<div class="mute">${t}: ${(h.leaders[k] || []).map((x) => `${esc(x.name)} ${k === "avg" ? f3(x.v) : k === "ra9" ? f2(x.v) : x.v}`).join(" · ")}</div>`).join("")}</div>`).join("")}</div>` : ""}
        <div class="card"><h2>Next season</h2><p class="mute">${F.settings(league).aging?"Complete the staged Offseason dashboard before beginning the next generated season. Aging, contracts, health and prospects carry forward.":"Keeps every roster, clears the standings and stats, and builds a fresh schedule. Rosters do not age or change."}</p>
          <div class="row"><label>Season name<input id="ns-label" type="text" value="Season ${league.history.length + 2}" style="width:140px"></label><button class="primary" id="ns-go"${done ? "" : " disabled"}>Start next season</button></div>
          ${done ? "" : `<p class="note">Available once the current season is complete.</p>`}</div>`;
      const go = document.getElementById("ns-go");
      if (league.history.some(h=>Object.keys(h.allStar || {}).length)) {
        const events = document.createElement("div");
        events.className = "card";
        events.innerHTML = `<h2>Past All-Star Festivities</h2>${league.history.map(h=>Object.values(h.allStar || {}).map(event=>`<p><b>${esc(h.label)}</b> · Derby: ${event.derby.champion === null ? "unfinished" : esc(event.derby.entrants[event.derby.champion].player.name)}${event.game ? ` · ${esc(event.teams[0].name)} ${event.game.score[0]}–${event.game.score[1]} ${esc(event.teams[1].name)}` : ""}</p>`).join("")).join("")}`;
        el.append(events);
      }
      go.addEventListener("click", () => {
        if(F.settings(league).aging){view.tab="offseason";render();return;}
        L.nextSeason(league, { seasonLabel: document.getElementById("ns-label").value });
        view.tab = "standings";
        saveNow();
        render();
      });
    }

    function tabSettings(el) {
      el.innerHTML = `<div class="card" data-no-memory><h2>League settings</h2>
        <div class="row"><label>League name<input id="lg-name" type="text" value="${esc(league.name)}"></label>
        <label>My team<select id="lg-my">${opt([["", "None"], ...league.teams.map((t, i) => [i, t.name])], league.settings.myTeam == null ? "" : league.settings.myTeam)}</select></label></div>
        ${settingsHtml(league.settings, true)}
        <p class="note">Schedule length, festivities placement, aging, starting year, draft size and roster sizes are fixed at creation. Injury frequency, trades and other enabled controls can change mid-season; ballpark, weather and innings apply from the next game.</p>
        <div class="row" style="margin-top:10px"><button class="primary" id="lg-save">Save settings</button><button id="lg-export">Export league</button><button id="lg-customization">Update customization</button></div>
        <p class="note">Update customization refreshes current players' attributes and team details from this browser's saved defaults. Roster assignments, results, standings, schedules and accumulated statistics stay intact. Changes apply to future games only.</p><div id="custom-status" role="status"></div></div>`;
      document.getElementById("lg-customization").disabled = running;
      document.getElementById("lg-customization").addEventListener("click", async () => {
        if (running || !await window.BrowserDialog.confirm("Update this league's current players and team details from Customization? Played games and roster assignments will not change.")) return;
        const targetId = league.id;
        document.getElementById("lg-customization").disabled = true;
        const years = new Set([league.year, ...league.teams.flatMap(t => [t.src?.year, ...[...t.roster.lineup, ...t.roster.bench, ...t.roster.rotation, ...t.roster.bullpen].map(p => p.customYear)])].filter(Boolean));
        let remaining = years.size;
        const update = () => {
          try {
            if (running || league.id !== targetId) throw new Error("Stop simulation and reopen league settings before updating.");
            const clubs = Object.fromEntries(L.mlbDescriptors(Object.keys(L.CLUBS)).map(t => [t.code, t]));
            league = C.updateLeague(league, { ...window.MLB_SEASONS, [latestYear]: window.MLB_PLAYERS }, clubs);
            if (!saveNow()) throw new Error("The updated league could not be saved to browser storage.");
            render();
            document.getElementById("custom-status").textContent = "Customization updated. Previous results and statistics were preserved.";
          } catch (error) {
            const status = document.getElementById("custom-status");
            if (status) status.textContent = `Couldn't update customization: ${error.message}`;
            else alert(`Couldn't update customization: ${error.message}`);
          }
        };
        if (!remaining) return update();
        let failed = false;
        for (const year of years) loadSeason(year, ok => {
          if (!ok) { failed = true; alert(`Couldn't load ${year} player data. No league customizations were applied.`); }
          if (--remaining === 0 && !failed) update();
        });
      });
      document.getElementById("lg-save").addEventListener("click", () => {
        let s;
        try{s=readSettings(league.settings);}catch(error){document.getElementById("custom-status").textContent=error.message;return;}
        if(!league.franchise&&F.enabled({...league,settings:s})&&JSON.parse(localStorage.getItem(PENDING_KEY))?.leagueId===league.id){document.getElementById("custom-status").textContent="Finish the pending game before enabling injury or trade systems.";return;}
        const my = document.getElementById("lg-my").value;
        s.myTeam = my === "" ? null : Number(my);
        if (s.myTeam === null && s.control === "hands") s.control = "all";
        league.name = document.getElementById("lg-name").value || league.name;
        league.settings = s;
        F.initialize(league);
        F.dayStart(league);
        saveNow();
        render();
      });
      document.getElementById("lg-export").addEventListener("click", () => {
        const blob = new Blob([JSON.stringify(league)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `league-${league.id}.json`;
        a.click();
      });
    }

    window.addEventListener("focus", () => { if (league && !running && importResult()) render(); });
    let customizationVersion = localStorage.getItem(C.KEY);
    window.addEventListener("message", event => {
      if (event.source !== parent || event.data?.type !== "dashboard-activate" || running) return;
      if (league) {
        if (importResult()) render();
      } else if (draft && customizationVersion !== localStorage.getItem(C.KEY)) {
        draft.settings = readSettings(draft.settings);
        const saved = C.fictional();
        draft.saved = draft.saved.filter(t => !t.customId).concat(saved);
        draft.teams = draft.teams.filter(t => !t.roster?.customId || saved.some(s => s.customId === t.roster.customId));
        for (const team of draft.teams.filter(t => t.roster?.customId)) {
          team.roster = saved.find(t => t.customId === team.roster.customId);
          team.savedIdx = draft.saved.findIndex(t => t.customId === team.roster.customId);
        }
        renderCreate();
      }
      customizationVersion = localStorage.getItem(C.KEY);
    });
    window.addEventListener("pagehide", () => { if (league) saveNow(); });
    const last = localStorage.getItem("field-notes-league-current");
    if (last && localStorage.getItem(LEAGUE_KEY(last)) && new URLSearchParams(location.search).get("open") !== "list") openLeague(last);
    else renderList();
  })();
  </script>
  <script src="settings-memory.js"></script>
</body>
</html>
