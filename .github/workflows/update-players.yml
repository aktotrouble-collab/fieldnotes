name: Update MLB player data

on:
  schedule:
    - cron: "17 10 * * *" # daily, ~3:17 AM Pacific
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild players-data.js
        run: node build-players.js
      - name: Commit if changed
        run: |
          # The file's "built" date changes daily, so compare the data itself.
          if git diff --quiet -I'"built":"[0-9-]*"' -- players-data.js; then
            echo "No data changes."
            git checkout -- players-data.js
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add players-data.js
          git commit -m "Update MLB player data"
          git push
